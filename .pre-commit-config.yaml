repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (all tracked *.sh)
        entry: shellcheck
        language: system
        files: \.sh$
  # Pinned to the commit of the v8.30.1 tag (issue #553): a tag can be moved,
  # a commit cannot. `pre-commit autoupdate --freeze` keeps this form.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
