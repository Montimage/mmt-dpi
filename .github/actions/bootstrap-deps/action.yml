name: Bootstrap build dependencies
description: >-
  Install the apt packages every CI job needs (libxml2-dev, libpcap-dev) plus
  any job-specific extras via the extra-packages input. The downloaded .deb
  archives are cached between runs so a clean checkout does not re-download
  them (issue #188, F-CI-008).
inputs:
  extra-packages:
    description: >-
      Space-separated list of additional apt packages to install on top of the
      base set (libxml2-dev libpcap-dev)
    required: false
    default: ""
runs:
  using: composite
  steps:
    # actions/cache extracts as the runner user; the archives directory is
    # root-owned on a fresh runner, so hand it over before the restore.
    - name: Make the apt archives directory cache-writable
      shell: bash
      run: |
        sudo mkdir -p /var/cache/apt/archives
        sudo chown -R "$(id -un)" /var/cache/apt/archives

    # ImageOS and ImageVersion are set by the GitHub-hosted runner image.
    - name: Identify the runner image
      id: image
      shell: bash
      run: |
        echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
        echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    # Only the downloaded .deb files are cached (issue #660). apt hands
    # archives/partial back to _apt (mode 700) and keeps archives/lock
    # root-only, so caching the whole directory made the post-job save fail
    # with "Permission denied" and no apt-* entry was ever written.
    # The architecture is part of the key: arm64 jobs (unit-tests-arm,
    # issue #528) must not restore amd64 archives, or the reverse. The image
    # OS keeps ubuntu-24.04 and ubuntu-26.04 apart, and the image version
    # saves a fresh entry each time the runner image is updated, seeded from
    # the previous one.
    - name: Cache apt archives
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /var/cache/apt/archives/*.deb
        key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.os }}-bootstrap-${{ inputs.extra-packages }}-${{ hashFiles('.github/actions/bootstrap-deps/action.yml') }}-${{ steps.image.outputs.version }}
        restore-keys: |
          apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.os }}-bootstrap-${{ inputs.extra-packages }}-${{ hashFiles('.github/actions/bootstrap-deps/action.yml') }}-
          apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.os }}-bootstrap-${{ inputs.extra-packages }}-
          apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.os }}-bootstrap-

    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -y
        # extra-packages is a space-separated word list by contract — word
        # splitting is intended here. The base set is checked against
        # tools/ci/build-deps.txt by tools/ci/check-dependency-lists.sh.
        sudo apt-get install -y libxml2-dev libpcap-dev ${{ inputs.extra-packages }}
