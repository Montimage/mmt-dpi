name: Deploy documentation site to Pages

# Builds the Jekyll site in docs/ (docs/_config.yml) and deploys it to GitHub
# Pages — but only when the documentation actually changes (issue #188,
# F-CI-017): before this workflow, every push to main redeployed the site
# whether or not docs/** moved.

on:
  push:
    branches: [ main ]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, in its own group — a newer docs push supersedes
# the in-flight deploy of an older tree.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      # A broken link should fail the deploy, not ship — the same check gates
      # PRs in the verify-helpers job of c-cpp.yml (issue #247).
      - name: Link-check the built site
        run: bash tools/ci/check-site-links.sh _site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site
          # The artifact only exists to hand the site from build to deploy
          # inside this run — one day is the minimum and all it needs.
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
