name: Deploy documentation site to Pages

# Builds the Jekyll site in docs/ (docs/_config.yml) and deploys it to GitHub
# Pages — but only when the documentation actually changes (issue #188,
# F-CI-017): before this workflow, every push to main redeployed the site
# whether or not docs/** moved.
#
# The site is built by tools/ci/build-docs-site.sh — the same script, frozen
# docs/Gemfile.lock and Jekyll 4 graph the verify-helpers job in c-cpp.yml
# runs on every PR (issue #386). The deploy job publishes that uploaded
# artifact as-is; nothing rebuilds it at deployment time (the former
# actions/jekyll-build-pages step rendered with github-pages' Jekyll 3.10).
# The artifact carries build-manifest.json (renderer versions, lock and site
# digests), served at <site>/build-manifest.json.

on:
  push:
    branches: [ main ]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "tools/ci/build-docs-site.sh"
      - "tools/ci/check-site-links.sh"
  workflow_dispatch:

# Least privilege: the build only reads the tree; the Pages-deployment scopes
# are granted to the deploy job alone.
permissions:
  contents: read

# One deployment at a time, in its own group — a newer docs push supersedes
# the in-flight deploy of an older tree.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby for the docs-site build
        uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          ruby-version: "3.3"
          working-directory: docs
          bundler-cache: true
        env:
          # Same frozen install as the PR verification (issue #372).
          BUNDLE_FROZEN: "true"
      # A broken link should fail the deploy, not ship — the same script and
      # checks gate PRs in the verify-helpers job of c-cpp.yml (issues #247,
      # #386).
      - name: Build the site with the locked Jekyll 4 recipe
        run: bash tools/ci/build-docs-site.sh
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/_site
          # The artifact only exists to hand the site from build to deploy
          # inside this run — one day is the minimum and all it needs.
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Publish only from main (push or a manual dispatch on main) — never
    # from a PR or another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
