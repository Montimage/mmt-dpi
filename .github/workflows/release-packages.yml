name: Build & release packages

# Compile, build and publish installable MMT-DPI packages for the major Linux
# distribution families:
#   - Debian / Ubuntu        -> .deb  (dpkg-deb, via `make deb`)
#   - RedHat / Rocky / CentOS -> .rpm  (rpmbuild, via `make rpm`)
#
# Each distribution is built inside its own container image (GitHub-hosted
# runners only provide Ubuntu/macOS/Windows), for both amd64 and arm64.
# The arm64 legs run on GitHub's native arm64 runner (see the build job).
# Every run uploads the packages as CI artifacts; pushing a `v*` tag
# additionally attaches them all to a GitHub Release.
#
# Every published asset is verifiable (issue #198, F-SEC-005/F-SEC-015):
# the build job writes a SPDX-JSON SBOM next to each package, and the
# release job adds a SHA256SUMS manifest over the whole asset set and a
# build-provenance attestation covering every published file, so users can
# run `sha256sum --check SHA256SUMS` and `gh attestation verify <pkg>`
# before installing the package as root.
#
# The five build container images are pinned by index digest
# (issue #217, F-DEP-101/F-CI-012/F-SEC-007) — the same digest resolves both
# the amd64 and arm64 matrix legs — and mirrored in the tracked
# tools/ci/base-images.txt, which the daily base-image-refresh.yml workflow
# resolves against upstream to flag drift and open the repin PR (issue #491).
#
# Reproducibility + tag gates (issue #220, F-CI-010/F-CI-011): the
# `reproducibility` job builds the package twice inside the same container
# and diffs the sha256 sums, and on tag pushes the `verify-tag` job checks
# the tag equals the VERSION declared in rules/common.mk and runs the
# release-prep validators — the publish job `needs` both, so nothing ships
# unverified.
#
# Exact-release-SHA gate (issue #371, F-CI-001): on tag pushes the
# `release-gates` job additionally requires that the unit, sanitizer and
# golden-classification checks recorded ON THE TAGGED COMMIT are green and
# that this run's own build/reproducibility/verify-tag jobs succeeded —
# evidence that is failed, skipped, cancelled or recorded for a different
# SHA blocks publication (`release` needs `release-gates` too).
#
# Single publisher (issue #489, F-CI-002): verify-tag also requires the
# tagged commit to be an ancestor of origin/main (v1.9.0 was cut from a
# stale release branch), the `release` job creates the Release itself —
# as a draft, assets attached, then published — and refuses when one
# already exists (a hand-made Release), and the `release-alert` job opens
# an issue whenever a tag run fails, so a blocked release is never silent.

on:
  push:
    tags: ["v*"]            # v1.0, v1.7.10, ... -> build + publish a release
  workflow_dispatch:        # manual build of the full matrix (no release)
  # Every pull request runs this workflow so the always-reporting
  # `packages-gate` aggregate can be a required check (issue #490, F-CI-004):
  # a workflow-level `paths:` filter left the context unreported on PRs that
  # touch no packaging path, so it could never be required. The path filter
  # moved into the `changes` job; build and reproducibility run only when it
  # matches.
  pull_request:             # validate packaging changes without releasing

# Release builds must run to completion — a re-run of the same tag queues
# behind the in-flight one instead of cancelling it (issue #188, F-CI-007:
# the tag-release workflow is the exception to cancel-in-progress).
# Pull-request runs do cancel their superseded run (issue #490): every PR now
# runs this workflow, and only tag and dispatch runs must run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    # Packaging path filter (issue #490): on a pull request, does the change
    # touch anything the package build reads? The checkout is the PR merge
    # commit, so HEAD^1 is the base branch tip and HEAD^1..HEAD is exactly the
    # PR's change. Tag pushes and manual dispatches always build.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Match the changed files against the packaging paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed: a diff that cannot run aborts the job (packages-gate
          # then fails) instead of reading as "no packaging change", and
          # --no-renames lists a file moved out of a packaging path under its
          # old name too, as the former workflow-level paths filter did.
          files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          packaging=false
          while IFS= read -r f; do
            case "$f" in
              sdk/*|src/*|rules/*|tools/ci/tests/*|\
              tools/ci/build-package.sh|tools/ci/install-build-deps.sh|\
              tools/ci/check-reproducible-build.sh|tools/ci/check-release-tag.sh|\
              tools/ci/check-release-gates.sh|tools/ci/publish-release.sh|\
              tools/ci/release-alert.sh|tools/ci/base-images.txt|\
              tools/ci/vendored-components.*|\
              .github/workflows/release-packages.yml)
                echo "packaging path changed: $f"
                packaging=true ;;
            esac
          done <<< "$files"
          echo "packaging=${packaging}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.distro.name }} (${{ matrix.arch }})
    # Each leg runs on a host of its own architecture (issue #421): arm64 on
    # the native ubuntu-24.04-arm runner (free for public repositories), so
    # no instruction is emulated. QEMU user emulation used to run the arm64
    # containers here, and its emulated ldconfig from the Ubuntu 22.04 image
    # (glibc 2.35) intermittently crashed with `qemu: uncaught target signal
    # 11` — in the libc-bin trigger and in the explicit ldconfig in
    # tools/ci/build-package.sh — failing the job on a correct package.
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # Cap every leg so a stuck build can't burn the 6-hour default limit.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro:
          - { name: ubuntu-22.04,   image: "ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7",                    pkg: deb }
          - { name: ubuntu-24.04,   image: "ubuntu:24.04@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254",                    pkg: deb }
          - { name: debian-12,      image: "debian:12@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443",                       pkg: deb }
          - { name: rocky-9,        image: "rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6",                    pkg: rpm }
          - { name: centos-stream9, image: "quay.io/centos/centos:stream9@sha256:086f25bff2b5e44eaa6953c8165cf6c4dcb3af8018b37053b510c7d5d796613c",   pkg: rpm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # GIT_VERSION (short hash) needs the git history

      # The matrix pin above must be mirrored verbatim in the tracked
      # tools/ci/base-images.txt — fail fast here rather than building on an
      # unrecorded image (issue #217; check-image-digests.sh gates the same).
      - name: Verify pinned base image is recorded
        run: grep -Fx "${{ matrix.distro.image }}" tools/ci/base-images.txt

      # -e CI forwards the runner's CI=true marker into the container so a
      # missing git history there is the hard error rules/common.mk intends
      # (issue #220) instead of a silently date-stamped package.
      - name: Build ${{ matrix.distro.pkg }} in ${{ matrix.distro.image }}
        run: |
          docker run --rm --platform "linux/${{ matrix.arch }}" \
            -e CI \
            -v "$PWD":/work -w /work \
            "${{ matrix.distro.image }}" \
            bash tools/ci/build-package.sh "${{ matrix.distro.name }}" "${{ matrix.distro.pkg }}"

      - name: Locate the built package
        id: pkg
        run: |
          set -euo pipefail
          # The build container ran as root, so dist/ is root-owned on the
          # host. Hand it back to the runner user — the SBOM step below must
          # create <pkg>.sbom.json inside dist/packages (CI verified EACCES).
          sudo chown -R "$(id -u):$(id -g)" dist
          # build-package.sh produces exactly one package per matrix cell —
          # fail loudly if that ever changes so the SBOM mapping stays 1:1.
          mapfile -t pkgs < <(find dist/packages -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.rpm' \) | LC_ALL=C sort)
          if [ "${#pkgs[@]}" -ne 1 ]; then
            echo "expected exactly 1 package in dist/packages," \
              "found ${#pkgs[@]}" >&2
            exit 1
          fi
          {
            echo "file=${pkgs[0]}"
            echo "sbom=${pkgs[0]}.sbom.json"
          } >> "$GITHUB_OUTPUT"

      # Per-package SBOM (F-SEC-015): scanned from the package file itself so
      # the manifest records exactly what the artifact ships. Generated here —
      # not in the tag-only release job — so the pull_request trigger exercises
      # it on every packaging change. upload-* are off: the package artifact
      # upload below ships the .sbom.json, and the release job's
      # tools/ci/publish-release.sh stays the single publisher (issue #489).
      - name: Generate SBOM for the package
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.pkg.outputs.file }}
          format: spdx-json
          output-file: ${{ steps.pkg.outputs.sbom }}
          artifact-name: sbom-${{ matrix.distro.name }}-${{ matrix.arch }}
          upload-artifact: false
          upload-release-assets: false

      # Vendored components (issue #496, F-DEP-305): syft sees the package as
      # one opaque file, so the SBOM would list only the package itself. Add
      # the third-party sources compiled into it — llhttp, the asn1c runtime —
      # from the tracked manifest tools/ci/vendored-components.json, before
      # the upload below and before the release job hashes and attests it.
      - name: Add vendored components to the SBOM
        env:
          SBOM: ${{ steps.pkg.outputs.sbom }}
        run: |
          set -euo pipefail
          python3 tools/ci/vendored-components.py check
          python3 tools/ci/vendored-components.py sbom "$SBOM"
          jq -e --slurpfile m tools/ci/vendored-components.json \
            '[.packages[].name] as $have
             | all($m[0].components[].name; . as $n | $have | index($n) != null)' \
            "$SBOM" > /dev/null
          jq -c '[.packages[].name]' "$SBOM"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mmt-dpi-${{ matrix.distro.name }}-${{ matrix.arch }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 30

  reproducibility:
    # F-CI-011 (issue #220): build the package twice inside the same
    # container and diff the sha256 sums — the AC for reproducible packages
    # is byte-identity, and this job is the gate that proves it. One amd64
    # leg per package format on images already pinned in the build matrix.
    name: Reproducible ${{ matrix.pkg }} build (${{ matrix.distro }})
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu-24.04, image: "ubuntu:24.04@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254",                    pkg: deb }
          - { distro: rocky-9,      image: "rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6",                   pkg: rpm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # GIT_VERSION + SOURCE_DATE_EPOCH derive from the commit

      - name: Verify pinned base image is recorded
        run: grep -Fx "${{ matrix.image }}" tools/ci/base-images.txt

      - name: Double-build and diff sha256 in ${{ matrix.image }}
        run: |
          docker run --rm -e CI \
            -v "$PWD":/work -w /work \
            "${{ matrix.image }}" \
            bash tools/ci/check-reproducible-build.sh --install-deps "${{ matrix.distro }}" "${{ matrix.pkg }}"

  packages-gate:
    # Required-check aggregate (issue #490, F-CI-004): one context that
    # reports on every pull request, whatever paths it touches. It passes
    # when the PR touches no packaging path and build + reproducibility were
    # skipped, and otherwise requires every package leg to have succeeded —
    # a failed, cancelled or unexpectedly skipped leg fails it.
    needs: [changes, build, reproducibility]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Package legs succeeded, or were skipped for a non-packaging change
        env:
          CHANGES: ${{ needs.changes.result }}
          PACKAGING: ${{ needs.changes.outputs.packaging }}
          BUILD: ${{ needs.build.result }}
          REPRO: ${{ needs.reproducibility.result }}
        run: |
          set -euo pipefail
          echo "changes=${CHANGES} packaging=${PACKAGING:-} build=${BUILD} reproducibility=${REPRO}"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::the packaging path filter did not succeed (${CHANGES})"
            exit 1
          fi
          if [ "$PACKAGING" = "true" ]; then
            want=success
          else
            want=skipped
          fi
          if [ "$BUILD" != "$want" ] || [ "$REPRO" != "$want" ]; then
            echo "::error::expected build and reproducibility ${want}, got ${BUILD} / ${REPRO}"
            exit 1
          fi
          echo "packages-gate: ok (packaging=${PACKAGING})"

  verify-tag:
    # F-CI-010 (issue #220): gate every tag publish. The tag must equal the
    # VERSION declared in rules/common.mk (a v1.9.0 tag on a 1.8.0 tree used
    # to publish mismatched packages), and the release-prep validators run
    # here — inside the release flow itself — instead of only as static
    # checks in c-cpp.yml. `release` needs this job, so nothing publishes
    # before it passes.
    name: Tag/version gate + release validators
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # GIT_VERSION derivation needs the git history

      # The ancestry gate (issue #489) needs origin/main: fetch it
      # explicitly rather than rely on what a tag checkout happens to fetch.
      - name: Fetch main for the ancestry check
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Tag matches the declared VERSION and is on main
        run: bash tools/ci/check-release-tag.sh "$GITHUB_REF_NAME"

      - name: Release-prep validators
        run: |
          bash tools/ci/check-release-verification.sh
          bash scripts/validate-release-prep.sh

  release-gates:
    # F-CI-001 (issue #371): nothing may publish on evidence from another
    # commit — every prerequisite gate must be green AT the tag SHA. The
    # script asserts the same-run prerequisite results through the needs
    # context (package matrix incl. the installed-consumer check, the
    # reproducibility double-build, the tag/version guard) and queries the
    # commit's check runs for the external gates (unit tests, the ASan/TSan
    # sanitizer suites + SDK profile, the golden classification
    # fingerprint). `if: always()` keeps the job running when a prerequisite
    # failed so the gate itself — not a skipped job — records why the tag
    # is ineligible. Tag pushes only: on PR/dispatch runs there is no
    # candidate SHA to verify, and the wiring is exercised on PRs by the
    # release_gates unit suite and check-release-verification.sh.
    name: Exact-SHA prerequisite evidence
    needs: [build, reproducibility, verify-tag]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read   # actions/checkout
      checks: read     # list the check runs recorded on the tag SHA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require exact-release-SHA evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_RESULT_BUILD: ${{ needs.build.result }}
          NEEDS_RESULT_REPRODUCIBILITY: ${{ needs.reproducibility.result }}
          NEEDS_RESULT_VERIFY_TAG: ${{ needs.verify-tag.result }}
        run: |
          # Peel annotated tags: github.sha is the tag object for those,
          # but the check-run evidence lives on the tagged commit.
          candidate="$(git rev-parse 'HEAD^{commit}')"
          echo "candidate commit: ${candidate} (ref: ${GITHUB_REF_NAME})"
          bash tools/ci/check-release-gates.sh \
            --evidence release-evidence.json "${candidate}"

      - name: Upload release evidence record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: release-evidence.json
          if-no-files-found: ignore
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: [build, reproducibility, verify-tag, release-gates]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # required to create/update the release
      id-token: write      # Sigstore OIDC identity for provenance signing
      attestations: write  # publish attestations to the repo attestation store
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect packages and SBOMs
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.sbom.json' \) \
            -exec cp -v {} release/ \;
          echo "Assets to publish:"
          ls -l release

      # The manifest covers every asset that will be attached — packages and
      # SBOMs — so `sha256sum --check SHA256SUMS` verifies the whole download.
      - name: Generate SHA256SUMS manifest
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%f\n' \
            | LC_ALL=C sort | xargs -r sha256sum -- > SHA256SUMS
          cat SHA256SUMS

      # One attestation whose subjects are every published file — including
      # SHA256SUMS itself — so `gh attestation verify <asset>` works for any
      # release asset (issue #198, F-SEC-005). Attest-before-publish keeps a
      # failed attestation from shipping unverifiable assets.
      - name: Attest build provenance for every release asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      # The only publisher (issue #489): refuses when a Release for the tag
      # already exists (made by hand), creates it as a draft with release/*
      # attached, then publishes it — never a Release without its assets.
      # This job has no source tree of its own: a sparse checkout fetches
      # just the script, at the tag's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          sparse-checkout: tools/ci/publish-release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Create and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash src/tools/ci/publish-release.sh "$GITHUB_REF_NAME" release

  release-alert:
    # A failed tag run gets an owner (issue #489, F-CI-002): v1.9.0's run
    # failed verify-tag and nobody noticed for 24 days. failure() is true
    # when any job in this chain failed, including one that made `release`
    # skip; cancelled() covers a cancelled run. A separate job so the
    # issues: write token never reaches a job that builds or publishes; tag
    # pushes only — a pull request's failure is visible on the pull request.
    name: Alert on a failed tag run
    needs: [build, reproducibility, verify-tag, release-gates, release]
    if: (failure() || cancelled()) && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read   # actions/checkout
      issues: write    # open or comment on the release-failure issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or update the release-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS_RESULT_BUILD: ${{ needs.build.result }}
          NEEDS_RESULT_REPRODUCIBILITY: ${{ needs.reproducibility.result }}
          NEEDS_RESULT_VERIFY_TAG: ${{ needs.verify-tag.result }}
          NEEDS_RESULT_RELEASE_GATES: ${{ needs.release-gates.result }}
          NEEDS_RESULT_RELEASE: ${{ needs.release.result }}
        run: bash tools/ci/release-alert.sh "$GITHUB_REF_NAME" "$RUN_URL"
