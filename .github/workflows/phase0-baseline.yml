name: Phase 0 baseline gate

# Gates the MMT-DPI Master Improvement Plan on the Phase 0 baselines:
#   1. the BUILD=asan (ASan/UBSan) profile must compile  — Phase 0 / Phase 2 gate
#   2. the golden-pcap classification fingerprint must be unchanged — phases 1-3,5,6
#   3. labelled-pcap precision/recall must hold or improve — Phase 7 (M9, #74)
#
# The classification and precision jobs are self-contained: they use the small
# pcap subset vendored under tools/phase0/ci/pcaps/, so they need no access to
# the mmt-test repo. See tools/phase0/README.md.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group: # the merge queue's run: every required context reports (#657)
  # Weekly drift check (issue #188, F-CI-015): image deprecations surface here.
  schedule:
    - cron: '17 4 * * 1'

# A newer push to a pull request cancels its superseded run (issue #188,
# F-CI-007). Push, tag and scheduled runs each get their own group and always
# complete (issue #660): a quick second merge no longer cancels the first
# main run before its jobs save their caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default (F-SEC-005): every job gets a read-only token; no job
# in this workflow needs write access (artifact upload works with read).
permissions:
  contents: read

jobs:
  changes:
    # Docs-only filter (issue #552, F-CI-009) — the same classifier as the
    # `changes` job of c-cpp.yml (see there): on a pull request that changes
    # only docs/ and root-level Markdown, the phase0 gates skip, and each
    # still reports its required context (a skipped job reports success;
    # harness-gate accepts a skipped matrix only then). !cancelled() runs
    # the gates when this job fails (fail-closed).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify the changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          bash tools/ci/classify-changes.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  asan-build:
    name: ASan/UBSan profile compiles
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap-deps
      - name: Build with BUILD=asan
        run: |
          make -C sdk clean
          make -C sdk -j"$(nproc)" BUILD=asan MMT_BASE="${RUNNER_TEMP}/mmt-asan"
      - name: Confirm the sanitizer runtime is wired into the library
        run: |
          lib="sdk/lib/libmmt_tcpip.so.$(grep -m1 '^VERSION' rules/common.mk | sed 's/.*:= *//')"
          echo "Checking ${lib} for ASan instrumentation ..."
          nm -D "${lib}" | grep -q '__asan_init' \
            && echo "OK: library is ASan-instrumented" \
            || { echo "FAIL: no ASan symbols in ${lib}"; exit 1; }

  list-harnesses:
    # Issue #182 (F-TEST-004): the harness jobs used to be hand-listed, and 14
    # of the 24 run_*.sh scripts — exactly the recent security-fix harnesses —
    # had drifted out of every workflow. The job count is now generated by
    # enumerating tools/phase0/tests/run_*.sh, so a newly added harness is
    # gated automatically with no workflow edit.
    name: Enumerate phase0 harnesses
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      harnesses: ${{ steps.list.outputs.harnesses }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        name: Enumerate tools/phase0/tests/run_*.sh
        run: |
          set -euo pipefail
          cd tools/phase0/tests
          entries=$(printf '"%s",' run_*.sh)
          echo "harnesses=[${entries%,}]"
          echo "harnesses=[${entries%,}]" >> "$GITHUB_OUTPUT"

  harness:
    # One matrix job per enumerated run_*.sh script (job names start with
    # "harness-" so `gh run view --json jobs` counts one job per script).
    # Each harness script builds+installs the SDK itself into its own
    # MMT_*_PREFIX (default: a fresh mktemp -d, removed by an exit trap —
    # issue #186), compiles its test/harness against
    # that library under the sanitizer it declares, and exits non-zero on any
    # failure — a clean exit plus matching fingerprints is the pass condition.
    # fail-fast: false keeps sibling harnesses running when one fails.
    name: harness-${{ matrix.harness }}
    needs: list-harnesses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.list-harnesses.outputs.harnesses) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap-deps
        with:
          extra-packages: python3
      - name: Run ${{ matrix.harness }}
        run: bash "tools/phase0/tests/${{ matrix.harness }}"

  harness-gate:
    # Issue #184 (F-CI-001): the harness matrix enumerates
    # tools/phase0/tests/run_*.sh dynamically, so its check contexts
    # (harness-run_*.sh) shift as scripts are added or renamed — pinning
    # them in branch protection would soft-lock merges on the first change.
    # This aggregate fails whenever the matrix fails, is cancelled, or is
    # skipped (e.g. a broken list-harnesses), giving branch protection one
    # stable context to require: `harness-gate`. The one accepted skip is a
    # docs-only pull request (`changes` succeeded with code=false, #552).
    name: harness-gate
    needs: [changes, harness]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harness matrix must succeed
        env:
          RESULT: ${{ needs.harness.result }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "harness matrix result: ${RESULT} (changes: ${CHANGES}, code=${CODE})"
          [ "${RESULT}" = "success" ] && exit 0
          if [ "${RESULT}" = "skipped" ] && [ "${CHANGES}" = "success" ] \
             && [ "${CODE}" = "false" ]; then
            echo "docs-only change: the harness matrix is skipped by design"
            exit 0
          fi
          exit 1

  classification-gate:
    name: Golden classification fingerprint unchanged
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap-deps
      - name: Check classification against the Phase 0 baseline
        run: tools/phase0/ci/check_classification.sh
      - name: Upload freshly captured fingerprint on mismatch
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase0-classification-actual
          path: tools/phase0/ci/baseline/classification.actual.txt
          if-no-files-found: ignore
          retention-days: 7

  leak-gate:
    # Issue #216 (F-TEST-008): named leak-regression cases for the four 1.8.0
    # leak fixes plus a whole-corpus teardown, run under Valgrind so any
    # definite leak fails the gate. The same harness also runs in the generic
    # harness matrix above — on hosts without valgrind it falls back to an
    # ASan detect_leaks=1 build — but this job pins the Valgrind oracle.
    # It reports under its job id, a short stable required context (#490).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap-deps
        with:
          extra-packages: valgrind
      - name: Run the named leak-regression cases under Valgrind
        run: bash tools/phase0/tests/run_leak_regression_test.sh

  precision-gate:
    name: Labelled-pcap precision/recall holds or improves (M9, issue #74)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # one install prefix shared by check_precision.sh and the accuracy oracle
      MMT_PREFIX: /tmp/mmt-phase0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap-deps
      - name: Check precision/recall against the committed baseline
        run: tools/phase0/ci/check_precision.sh
      # Reviewed DNS/TLS/QUIC/HTTP-2 (issue #389) and S1AP/NGAP/NAS plus
      # unknown/malformed (issue #390) cases, F-TEST-003; reuses the SDK
      # check_precision.sh installed under $MMT_PREFIX.
      - name: Check the accuracy corpus against its reviewed expectations
        run: python3 tools/ci/tests/check-accuracy-corpus.py --prefix "$MMT_PREFIX" --no-build
      - name: Upload freshly captured metrics on mismatch
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase0-precision-actual
          path: tools/phase0/ci/baseline/precision.actual.txt
          if-no-files-found: ignore
          retention-days: 7
