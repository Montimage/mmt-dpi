name: Phase 0 baseline gate

# Gates the MMT-DPI Master Improvement Plan on the Phase 0 baselines:
#   1. the golden-pcap classification fingerprint must be unchanged — phases 1-3,5,6
#   2. labelled-pcap precision/recall must hold or improve — Phase 7 (M9, #74)
# The BUILD=asan (ASan/UBSan) profile compile gate moved into c-cpp.yml's
# sanitizer-tests (BUILD=asan, asan) leg (issue #659); its old context
# `ASan/UBSan profile compiles` is a retired stub there.
#
# The classification and precision jobs are self-contained: they use the small
# pcap subset vendored under tools/phase0/ci/pcaps/, so they need no access to
# the mmt-test repo. See tools/phase0/README.md.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group: # the merge queue's run: every required context reports (#657)
  # Weekly drift check (issue #188, F-CI-015): image deprecations surface here.
  schedule:
    - cron: '17 4 * * 1'

# A newer push to a pull request cancels its superseded run (issue #188,
# F-CI-007). Push, tag and scheduled runs each get their own group and always
# complete (issue #660): a quick second merge no longer cancels the first
# main run before its jobs save their caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default (F-SEC-005): every job gets a read-only token; no job
# in this workflow needs write access (artifact upload works with read).
permissions:
  contents: read

jobs:
  changes:
    # Path-to-test selection (issues #552, #656) — the same classify step as
    # the `changes` job of c-cpp.yml (see there for the tiers). On a docs-only
    # or tooling pull request (gates=false) the phase0 jobs skip, and each
    # still reports its required context (a skipped job reports success;
    # harness-gate accepts skipped harness legs only then). On the tests and
    # family tiers the harness legs run only the harnesses named in
    # `harnesses` (run_all_harnesses.sh --only); full runs them all. The
    # gates run on every tier but docs and tooling. Conditions read
    # `!= 'false'`, and !cancelled() runs the gates when this job fails, so a
    # failed `changes` runs everything (fail-closed).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      tier: ${{ steps.filter.outputs.tier }}
      full: ${{ steps.filter.outputs.full }}
      gates: ${{ steps.filter.outputs.gates }}
      suites: ${{ steps.filter.outputs.suites }}
      harnesses: ${{ steps.filter.outputs.harnesses }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify the changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Not a pull request: no path list, which the classifier answers
          # with full (every output key set).
          changed=/dev/null
          if [ "$EVENT" = pull_request ]; then
            # A diff that cannot run fails the job, and the gated jobs then run.
            changed="$RUNNER_TEMP/changed.txt"
            git diff --no-renames --name-only HEAD^1 HEAD > "$changed"
          fi
          # Complete answers only: a classifier that fails writes no output.
          bash tools/ci/classify-changes.sh < "$changed" > "$RUNNER_TEMP/classified.txt"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/classified.txt"

  harness:
    # Issue #655: the harnesses used to run as one matrix job per
    # tools/phase0/tests/run_*.sh (issue #182) — 50 jobs, 50 identical SDK
    # builds, queued behind the 20-concurrent-job cap. Each leg now runs one
    # slice of tools/phase0/run_all_harnesses.sh, which enumerates run_*.sh
    # at run time, groups the scripts by the SDK profile their own build step
    # names (none/default/asan/tsan), builds each profile once into a shared
    # prefix and replays the group's harnesses against it with
    # MMT_SDK_PREBUILT=1. --group/--shard select the slice: the legs together
    # cover every group, and the K/N shards of one group are disjoint and
    # cover it, so a newly added harness is gated with no workflow edit
    # (pinned by tools/ci/tests/test-harness-shards.sh). A failing harness is
    # named in the leg's verdict table (also in the job summary), as an
    # ::error annotation and by its own log in the uploaded artifact.
    # fail-fast: false keeps sibling legs running when one fails; no
    # job-level `if:` beyond the docs-only and tooling skip, which
    # harness-gate accepts. On the tests and family tiers (full=false) each
    # leg keeps only the harnesses `changes` names (--only, issue #656); a
    # leg left with none builds nothing and passes.
    name: harness-${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.gates != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: asan-1of3
            select: --group asan --shard 1/3
          - shard: asan-2of3
            select: --group asan --shard 2/3
          - shard: asan-3of3
            select: --group asan --shard 3/3
          - shard: default
            select: --group none,default
          - shard: tsan
            select: --group tsan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap-deps
        with:
          extra-packages: python3
      - name: Run the ${{ matrix.shard }} harnesses
        env:
          SELECT: ${{ matrix.select }}
          FULL: ${{ needs.changes.outputs.full }}
          HARNESSES: ${{ needs.changes.outputs.harnesses }}
        run: |
          # Fail-closed: only an explicit full=false narrows the run.
          only=()
          if [ "$FULL" = false ]; then only=(--only "$HARNESSES"); fi
          # word-split on purpose: SELECT is the leg's option list
          # shellcheck disable=SC2086
          bash tools/phase0/run_all_harnesses.sh $SELECT "${only[@]}" \
            --log-dir "${RUNNER_TEMP}/harness-logs"
      - name: Upload the per-harness logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase0-harness-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/harness-logs
          if-no-files-found: ignore
          retention-days: 7

  harness-gate:
    # Issue #184 (F-CI-001): the harness legs' check contexts
    # (harness-<shard>) are an implementation detail that changes with the
    # sharding (issue #655 replaced the per-script harness-run_*.sh legs) —
    # pinning them in branch protection would soft-lock merges on the first
    # change. This aggregate fails whenever any leg fails, is cancelled, or
    # is skipped, giving branch protection one stable context to require:
    # `harness-gate`. The one accepted skip is a docs-only or tooling pull
    # request (`changes` succeeded with code=false, #552, or gates=false,
    # #656).
    name: harness-gate
    needs: [changes, harness]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harness legs must succeed
        env:
          RESULT: ${{ needs.harness.result }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          GATES: ${{ needs.changes.outputs.gates }}
        run: |
          echo "harness legs result: ${RESULT} (changes: ${CHANGES}, code=${CODE}, gates=${GATES})"
          [ "${RESULT}" = "success" ] && exit 0
          if [ "${RESULT}" = "skipped" ] && [ "${CHANGES}" = "success" ] \
             && { [ "${CODE}" = "false" ] || [ "${GATES}" = "false" ]; }; then
            echo "docs-only or tooling change: the harness legs are skipped by design"
            exit 0
          fi
          exit 1

  classification-gate:
    name: Golden classification fingerprint unchanged
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.gates != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap-deps
      - name: Check classification against the Phase 0 baseline
        run: tools/phase0/ci/check_classification.sh
      - name: Upload freshly captured fingerprint on mismatch
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase0-classification-actual
          path: tools/phase0/ci/baseline/classification.actual.txt
          if-no-files-found: ignore
          retention-days: 7

  leak-gate:
    # Issue #216 (F-TEST-008): named leak-regression cases for the four 1.8.0
    # leak fixes plus a whole-corpus teardown, run under Valgrind so any
    # definite leak fails the gate. The same harness also runs in the asan
    # harness legs above — against the shared ASan prefix, as an ASan
    # detect_leaks=1 check — but this job pins the Valgrind oracle.
    # It reports under its job id, a short stable required context (#490).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.gates != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap-deps
        with:
          extra-packages: valgrind
      - name: Run the named leak-regression cases under Valgrind
        run: bash tools/phase0/tests/run_leak_regression_test.sh

  precision-gate:
    name: Labelled-pcap precision/recall holds or improves (M9, issue #74)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.gates != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # one install prefix shared by check_precision.sh and the accuracy oracle
      MMT_PREFIX: /tmp/mmt-phase0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/bootstrap-deps
      - name: Check precision/recall against the committed baseline
        run: tools/phase0/ci/check_precision.sh
      # Reviewed DNS/TLS/QUIC/HTTP-2 (issue #389) and S1AP/NGAP/NAS plus
      # unknown/malformed (issue #390) cases, F-TEST-003; reuses the SDK
      # check_precision.sh installed under $MMT_PREFIX.
      # --base HEAD^1 (the base tip): coverage-pending.txt only shrinks (#527).
      - name: Check the accuracy corpus against its reviewed expectations
        run: python3 tools/ci/tests/check-accuracy-corpus.py --prefix "$MMT_PREFIX" --no-build --base HEAD^1
      - name: Upload freshly captured metrics on mismatch
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase0-precision-actual
          path: tools/phase0/ci/baseline/precision.actual.txt
          if-no-files-found: ignore
          retention-days: 7
