name: Base image refresh

# Digest-drift job for the container images CI pulls (issue #491,
# F-DEP-202/F-DEP-201). Dependabot only sees images in Dockerfiles, so the
# name:tag@sha256 pins recorded in tools/ci/base-images.txt are resolved here
# instead: tools/ci/refresh-base-images.sh asks each registry for the digest
# the tag points at today and whether the pinned digest still exists.
#
# Daily, not weekly: quay.io retags centos/centos:stream9 about weekly and
# 404s the previous manifest at once (issues #587/#590), so a weekly diff
# would leave the release build broken for up to a week.
#
# Hourly for the quay.io pins (issue #641): quay.io retags stream9 and
# stream10 at any hour and the old pin fails to pull at once, so the daily
# run (which GitHub has started 4-6 h late) left PR CI broken for up to a
# day. The hourly run checks only `--registry quay.io` — two pins, no Docker
# Hub requests, and no hourly failure for a Docker Hub tag that moved while
# its old digest still pulls — and any violation it finds triggers the same
# full --write repin. Scheduled runs are best-effort (GitHub delays them
# under load), so the bound is "about an hour after the retag", not a
# guarantee; the residual window is the retag-to-repin time.
#
# On drift or a missing digest the `drift` job fails (the visible signal) and
# the `repin` job rewrites every drifted pin with --write. Those pins are
# quoted in workflow files, and the built-in GITHUB_TOKEN can never push a
# change under .github/workflows/ (it cannot be granted the `workflows`
# scope), so the job proposes the repin one of two ways:
#   - with the repository secret BASE_IMAGE_REFRESH_TOKEN set (a fine-grained
#     token or GitHub App token with contents, pull-requests and workflows
#     write on this repository) it force-pushes ci/base-image-refresh and
#     opens or updates one pull request — which, unlike a GITHUB_TOKEN PR,
#     also starts CI;
#   - without it, it opens or updates one issue titled "Base image pins out
#     of date" carrying the exact diff and the command to apply it.
# Creating that secret is a maintainer decision; nothing here requires it.
# An inconclusive check (a registry did not answer, exit 2) fails the drift
# job without proposing anything — rerun the workflow.

on:
  schedule:
    - cron: '41 5 * * *'   # every pin
    - cron: '17 * * * *'   # quay.io pins only (QUAY_HOURLY below)
  workflow_dispatch:

env:
  # Must equal the hourly cron string above: github.event.schedule carries
  # the string of the schedule that fired, and only that one narrows the check.
  QUAY_HOURLY: '17 * * * *'

# One run per scope at a time. A newer pending run replaces an older pending
# one in its group, so the hourly runs get a group of their own and can never
# displace a pending daily or dispatched full check; the repin job has a
# shared group below, so two scopes never race on the repin branch or issue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule == '17 * * * *' && 'quay' || 'full' }}
  cancel-in-progress: false

# Least-privilege default (F-SEC-005): only the repin job gets a write scope.
permissions:
  contents: read

jobs:
  drift:
    name: Resolve every pinned base image tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      rc: ${{ steps.check.outputs.rc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every recorded pin matches its upstream tag
        id: check
        continue-on-error: true
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set +e
          scope=()
          if [ "$SCHEDULE" = "$QUAY_HOURLY" ]; then scope=(--registry quay.io); fi
          bash tools/ci/refresh-base-images.sh --check "${scope[@]}"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Fail on drift, a missing digest or an inconclusive check
        if: steps.check.outputs.rc != '0'
        env:
          RC: ${{ steps.check.outputs.rc }}
        run: |
          if [ "$RC" = 1 ]; then
            echo "::error title=base image drift::a pinned base image tag moved or its digest is gone upstream — see the step above; the repin job proposes the fix"
          else
            echo "::error title=base image check inconclusive::a registry did not answer or the helper broke (exit ${RC:-none}) — nothing proposed; rerun the workflow"
          fi
          exit 1

  repin:
    name: Propose the repin
    needs: drift
    if: always() && needs.drift.outputs.rc == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-repin
      cancel-in-progress: false
    permissions:
      contents: read   # actions/checkout; the push uses the dedicated token
      issues: write    # open or update the repin issue when there is none
    env:
      BRANCH: ci/base-image-refresh
      HAS_REPIN_TOKEN: ${{ secrets.BASE_IMAGE_REFRESH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BASE_IMAGE_REFRESH_TOKEN || github.token }}
          persist-credentials: ${{ secrets.BASE_IMAGE_REFRESH_TOKEN != '' }}

      - name: Rewrite every drifted pin
        run: |
          set +e
          bash tools/ci/refresh-base-images.sh --write > "$RUNNER_TEMP/repin.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/repin.txt"
          if git diff --quiet; then
            echo "::error title=base image repin::no pin could be rewritten (exit $rc) — see the output above"
            exit 1
          fi
          git diff > "$RUNNER_TEMP/repin.diff"
          bash tools/ci/check-image-digests.sh

      - name: Open or update the repin pull request
        if: env.HAS_REPIN_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.BASE_IMAGE_REFRESH_TOKEN }}
          BASE: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -qam "ci(images): repin drifted base images (#491)"
          # Re-push only a changed tree: while a pin stays missing the hourly
          # run proposes the same repin every hour, and a new commit each time
          # would restart the PR's CI before it can finish (issue #641).
          if git fetch -q origin "$BRANCH" 2>/dev/null \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "$BRANCH already carries this repin — not re-pushed"
          else
            git push --force origin "$BRANCH"
          fi
          {
            echo "Automated repin from \`tools/ci/refresh-base-images.sh --write\` (issue #491)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/repin.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          # Same-repository PRs only: a fork PR whose branch is also named
          # ci/base-image-refresh must never have its body rewritten.
          pr="$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository \
                  --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "ci(images): repin drifted base images" \
              --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Open or update the repin issue
        if: env.HAS_REPIN_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Base image pins out of date"
          {
            echo "The scheduled [base-image-refresh run]($RUN_URL) found drifted or garbage-collected base image pins (issue #491)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/repin.txt"
            echo '```'
            echo
            echo "Apply with \`bash tools/ci/refresh-base-images.sh --write\` and open a pull request, or set the \`BASE_IMAGE_REFRESH_TOKEN\` secret (contents, pull-requests and workflows write) so this job opens it. The rewrite:"
            echo
            echo '```diff'
            cat "$RUNNER_TEMP/repin.diff"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          # Only an issue this job opened: anyone can file an issue with the
          # same title, and its author could later rewrite the body the job
          # put there (a forged "apply this diff"). Searched by title and
          # filtered on the bot login: `--author app/github-actions` matches
          # nothing, so every run used to open a new duplicate (issue #641).
          # The oldest open one is the one kept up to date.
          issue="$(gh issue list --state open --limit 100 --search "in:title \"$title\"" \
                    --json number,title,author \
                    --jq ".[] | select(.title == \"$title\" and .author.is_bot and .author.login == \"app/github-actions\") | .number" \
                    | sort -n | head -n1)"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
