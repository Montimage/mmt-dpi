name: Install smoke

# One-command install smoke matrix (issue #493, F-CI-113).
#
# README and the docs advertise a one-line install (`curl -fsSL … | bash`)
# and a landing-page first run (docs/_includes/first-example.md); install.sh
# carries a package-manager branch per advertised distribution family. This
# workflow runs both, end to end, in a fresh container per distribution the
# docs name, with LD_LIBRARY_PATH unset: tools/ci/smoke-install.sh installs
# the one-liner's own prerequisites (curl, bash), pipes the installer into
# bash, then runs the three displayed first-run steps in an empty directory
# and compares the output with the displayed one.
#
# Source of the installer (tools/ci/smoke-install.sh --source):
#   pull_request        local — install.sh is read from the PR checkout over a
#                       file:// URL (the published script is never fetched)
#                       and its clone is redirected to the checkout, so the
#                       PR's installer builds the PR's SDK
#   schedule, release,  published — the README one-liner verbatim: main's
#   workflow_run        install.sh from raw.githubusercontent.com, which
#                       clones and verifies the pinned release tag, and the
#                       first-run files from the documentation site
#   workflow_dispatch   either (input `source`, default published)
#
# APT repository legs (issue #78; repository design in #24): `apt` installs
# mmt-dpi and mmt-dpi-security from the signed repository
# https://montimage.github.io/packages — deb822 source, Signed-By the
# published keyring, whose primary key must be the committed
# debian/upstream/signing-key.asc — on every Debian/Ubuntu release it serves,
# on amd64 and arm64, and runs the installed-consumer check
# (tools/ci/tests/run-installed-consumer.sh --root-install, taken from the
# installed release's tag so the check matches the SDK under test);
# `apt-tamper` changes one byte of a local copy of InRelease and requires
# apt-get update to fail on the signature (tools/ci/smoke-apt.sh). The
# version comes from `apt-ready`: on a post-release run, the released tag,
# once every suite and architecture lists it (the tag run dispatches the
# repository rebuild, which ends minutes later); otherwise the newest version
# the repository lists. All APT legs are supported.
#
# Tiers: `supported` legs must pass; `best-effort` legs (distributions the
# docs label best-effort — README "Key Features" and the One-Line Install text
# of README "Install" / docs/_includes/quick-start.md) run their smoke step
# with continue-on-error, so a regression there is a warning, never red.
#
# Not a required check: the pull_request trigger is path-filtered, so it does
# not report on every PR (tools/ci/check-required-checks.sh, issue #490).

on:
  pull_request:
    paths:
      - install.sh
      - sdk/Makefile
      - docs/first-run/**
      - docs/_includes/first-example.md
      - tools/ci/smoke-install.sh
      - tools/ci/smoke-apt.sh
      - debian/upstream/signing-key.asc
      - .github/workflows/install-smoke.yml
  schedule:
    - cron: "17 5 * * 1"          # weekly, Monday 05:17 UTC
  # After every published release. A release created by the release workflow
  # with GITHUB_TOKEN raises no `release` event (GitHub suppresses events
  # caused by that token), so the completed tag run is the trigger that
  # fires; `release: published` covers a release published by a person.
  release:
    types: [published]
  workflow_run:
    workflows: ["Build & release packages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source:
        description: "published = the README one-liner; local = this ref's install.sh and SDK"
        type: choice
        options: [published, local]
        default: published

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default (F-SEC-005): only the report job writes (issues).
permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.name }} (${{ matrix.tier }})
    # workflow_run: only a successful tag run of the release workflow (its
    # pull_request and workflow_dispatch runs publish nothing).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every image is digest-pinned and recorded in
          # tools/ci/base-images.txt (check-image-digests.sh, refreshed daily
          # by base-image-refresh.yml).
          - { name: ubuntu-22.04, tier: supported, image: "ubuntu:22.04@sha256:9abcaffc92a5279fff3a6a41635c0800ea33e528425fb389658806476e7defde" }
          - { name: ubuntu-24.04, tier: supported, image: "ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8" }
          - { name: debian-12, tier: supported, image: "debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8" }
          - { name: rocky-9, tier: supported, image: "rockylinux:9@sha256:03303863808e9cd79f0c58c833db3e5f9cde9f2abe16804a267b05dc54af86e4" }
          - { name: centos-stream9, tier: supported, image: "quay.io/centos/centos:stream9@sha256:280add9b43d478ff06de6ccc6285afa7f1d81d8a0ea0d63e292a2f87f1d5aedf" }
          - { name: fedora-44, tier: supported, image: "fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e" }
          - { name: opensuse-leap-16.0, tier: supported, image: "registry.opensuse.org/opensuse/leap:16.0@sha256:9c88da273b41600dfd12790849dfb198ddefed3a109eaf42ada944afb4282a9d" }
          # Best-effort: Arch is rolling (no arm64 image upstream); Alpine is
          # musl, which the SDK does not build on today.
          - { name: archlinux, tier: best-effort, image: "archlinux:base@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899" }
          - { name: alpine-3.23, tier: best-effort, image: "alpine:3.23@sha256:469c9ea410b9215eaee7976ba6c0639039b444be8e5d638f7abbada189971eb2" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the installer source
        id: source
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SOURCE: ${{ inputs.source }}
        run: |
          case "$EVENT" in
            pull_request)      source=local ;;
            workflow_dispatch) source="${INPUT_SOURCE:-published}" ;;
            *)                 source=published ;;
          esac
          echo "source=$source" >> "$GITHUB_OUTPUT"
          # local: the installer clones this branch from the checkout.
          if [ "$source" = local ]; then git branch -f install-smoke HEAD; fi
          echo "Installer source: $source"

      - name: One-command install + first run in ${{ matrix.name }}
        id: smoke
        # Step-level, so a best-effort failure leaves the job (and the report
        # job's needs.smoke.result) green while the step still shows red.
        continue-on-error: ${{ matrix.tier == 'best-effort' }}
        # Below the job's 45 minutes, so a hung best-effort leg times out
        # here, where continue-on-error absorbs it, not as a red job.
        timeout-minutes: 40
        env:
          IMAGE: ${{ matrix.image }}
          SOURCE: ${{ steps.source.outputs.source }}
        run: |
          args=(--source "$SOURCE")
          [ "$SOURCE" = local ] && args+=(--ref install-smoke)
          # bash is not in every base image (Alpine): add it before the
          # script, which needs it to run at all.
          docker run --rm -e JOBS=4 -v "$PWD":/work:ro -w /work "$IMAGE" \
            sh -c '[ -x /bin/bash ] || apk add --no-cache bash >/dev/null; exec bash tools/ci/smoke-install.sh "$@"' \
            _ "${args[@]}"

      - name: Record the verdict
        if: always()
        env:
          NAME: ${{ matrix.name }}
          TIER: ${{ matrix.tier }}
          SOURCE: ${{ steps.source.outputs.source }}
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          echo "| $NAME | $TIER | $SOURCE | $OUTCOME |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TIER" = best-effort ] && [ "$OUTCOME" != success ]; then
            echo "::warning title=best-effort distribution failed::$NAME: the one-command install or first run failed ($OUTCOME) — labelled best-effort in README, not gating"
          fi

  apt-ready:
    name: APT repository version
    # The smoke job's condition: only a successful tag run of the release
    # workflow triggers a post-release run.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci/smoke-apt.sh
          sparse-checkout-cone-mode: false

      - name: Resolve the version every suite and architecture lists
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Post-release runs wait for the released tag; the others take
          # the newest version the repository lists.
          case "$EVENT" in
            workflow_run) args=(--tag "$RUN_TAG") ;;
            release)      args=(--tag "$RELEASE_TAG") ;;
            *)            args=() ;;
          esac
          version="$(bash tools/ci/smoke-apt.sh --resolve "${args[@]}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "APT repository version: $version"

  apt:
    name: apt ${{ matrix.distro.name }} ${{ matrix.platform.arch }}
    needs: apt-ready
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The Debian/Ubuntu releases the repository serves. Digest-pinned
        # and recorded in tools/ci/base-images.txt; arm64 runs natively.
        distro:
          - { name: ubuntu-22.04, image: "ubuntu:22.04@sha256:9abcaffc92a5279fff3a6a41635c0800ea33e528425fb389658806476e7defde" }
          - { name: ubuntu-24.04, image: "ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8" }
          - { name: ubuntu-26.04, image: "ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db" }
          - { name: debian-12, image: "debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8" }
          - { name: debian-13, image: "debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6" }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The consumer and its fixtures as the installed release shipped them:
      # this ref's copy may expect a later SDK.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.apt-ready.outputs.version }}
          path: released
          persist-credentials: false
          sparse-checkout: |
            tools/ci/tests/
            tools/phase0/ci/pcaps/
          sparse-checkout-cone-mode: false

      - name: Install mmt-dpi from the APT repository in ${{ matrix.distro.name }} (${{ matrix.platform.arch }})
        id: smoke
        env:
          IMAGE: ${{ matrix.distro.image }}
          VERSION: ${{ needs.apt-ready.outputs.version }}
        run: |
          docker run --rm -v "$PWD":/work:ro -w /work "$IMAGE" \
            bash tools/ci/smoke-apt.sh --version "$VERSION" \
              --consumer-dir /work/released/tools/ci/tests

      - name: Record the verdict
        if: always()
        env:
          NAME: ${{ matrix.distro.name }} ${{ matrix.platform.arch }}
          OUTCOME: ${{ steps.smoke.outcome }}
        run: echo "| $NAME | supported | apt | $OUTCOME |" >> "$GITHUB_STEP_SUMMARY"

  apt-tamper:
    name: apt rejects a tampered InRelease
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: One byte of a local InRelease changed; apt-get update must fail
        env:
          IMAGE: "ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8"
        run: |
          docker run --rm -v "$PWD":/work:ro -w /work "$IMAGE" \
            bash tools/ci/smoke-apt.sh --expect-reject

  report:
    name: Report a failing supported distribution
    needs: [smoke, apt-ready, apt, apt-tamper]
    # Scheduled and post-release runs only: a pull request shows its own red.
    if: >-
      always() && contains(needs.*.result, 'failure') &&
      github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write    # open or update the tracking issue
    steps:
      - name: Open or update the install smoke issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          title="Install smoke matrix failing"
          {
            echo "The [install smoke run]($RUN_URL) (\`$EVENT\`) failed on at least one **supported** leg (issues #493, #78)."
            echo
            echo "The README one-liner, the landing-page first run or the APT repository install no longer works there. Open the run for the failing leg's log, and reproduce it as root in that leg's pinned image (the matrices in \`.github/workflows/install-smoke.yml\`), with this checkout mounted: \`bash tools/ci/smoke-install.sh --source published\` for a one-liner leg, \`bash tools/ci/smoke-apt.sh\` for an \`apt\` leg (\`--expect-reject\` for the tampered-InRelease leg). An \`APT repository version\` failure means the repository does not list the released version for every suite and architecture: check the Montimage/packages rebuild the tag run dispatched (\`tools/ci/notify-packages.sh\`)."
          } > "$RUNNER_TEMP/body.md"
          # Only an issue this job opened: anyone can file an issue with the
          # same title, and its author could later rewrite the body (#598).
          issue="$(gh issue list --state open --limit 200 --author app/github-actions \
                    --json number,title,author \
                    --jq ".[] | select(.title == \"$title\" and .author.is_bot) | .number" | head -n1)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
