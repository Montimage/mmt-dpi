name: C/C++ CI

on:
  push:
    branches: [ main ]
    tags: ["v*"] # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches: [ main ]

# Least-privilege default (F-SEC-005): every job gets a read-only token unless
# it declares its own elevated permissions block.
permissions:
  contents: read

jobs:
  unit-tests:
    # Compile-and-run the standalone unit suites (tests/run_all_tests.sh).
    # The full set runs with the default toolchain; the core suites are also
    # built with -fsigned-char so signed/unsigned-char portability bugs (plain
    # `char` is signed on x86, unsigned on ARM) are caught in CI rather than
    # only on the developer's machine.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra_cflags: ""
            suites: ""
          - extra_cflags: "-fsigned-char"
            suites: "hashmap memory hexdump mmt_utils mmt_inet_ntop"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install dependencies
      run: sudo apt-get update -y && sudo apt-get install -y libxml2-dev libpcap-dev
    - name: Run unit test suites
      env:
        EXTRA_CFLAGS: ${{ matrix.extra_cflags }}
      run: bash tests/run_all_tests.sh ${{ matrix.suites }}

  sanitizer-tests:
    # Run the unit suites (tests/run_all_tests.sh) under the sanitizer
    # profiles. The matrix entries name the SDK profiles they mirror
    # (BUILD=asan / BUILD=tsan in rules/common.mk); the runner translates
    # them into per-suite instrumentation via SANITIZE=asan|tsan, and suites
    # that build the SDK internally inherit the matching BUILD= profile.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: BUILD=asan
            sanitize: asan
          - profile: BUILD=tsan
            sanitize: tsan
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install dependencies
      run: sudo apt-get update -y && sudo apt-get install -y libxml2-dev libpcap-dev
    - name: Run unit test suites under sanitizers (${{ matrix.profile }})
      env:
        SANITIZE: ${{ matrix.sanitize }}
      run: bash tests/run_all_tests.sh

  coverage:
    # Measure unit-suite coverage (gcov): run every suite instrumented with
    # --coverage, emit tests/coverage/coverage.info (lcov tracefile) and print
    # the overall line percentage; publish the report as a CI artifact.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install dependencies
      run: sudo apt-get update -y && sudo apt-get install -y libxml2-dev libpcap-dev jq
    - name: Run unit test suites with coverage
      run: bash tests/run_all_tests.sh --coverage
    - name: Upload coverage report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unit-suite-coverage
        path: tests/coverage/

  lint:
    # Lint/static-analysis gate (issue #125): shellcheck runs blocking across
    # every tracked shell script; cppcheck runs warnings-only as an advisory
    # baseline and publishes its findings as a report artifact. The generated
    # ASN.1 tree (src/mmt_mobile/asn1c) is excluded from the scan.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install lint tools
      run: sudo apt-get update -y && sudo apt-get install -y shellcheck cppcheck
    - name: shellcheck (all tracked shell scripts, blocking)
      run: shellcheck $(git ls-files '*.sh')
    - name: cppcheck (warnings-only, advisory)
      run: |
        # sdk/include is generated by the SDK build, so it does not exist in a
        # fresh checkout — only exclude the generated ASN.1 tree here.
        cppcheck --enable=warning --inline-suppr -j"$(nproc)" \
          -i src/mmt_mobile/asn1c \
          --xml --xml-version=2 \
          src \
          2> cppcheck-report.xml || true
        # A crashed or missing cppcheck must not look like a clean scan: the
        # <results> skeleton is written even at zero findings, never on abort.
        grep -q '<results' cppcheck-report.xml \
          || { echo "cppcheck did not produce a parseable report"; exit 1; }
        echo "cppcheck findings: $(grep -c '<error' cppcheck-report.xml || true)"
    - name: Upload cppcheck findings report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cppcheck-findings-report
        path: cppcheck-report.xml
        if-no-files-found: error

  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: build-from-source
      run: |
         sudo apt-get update -y && sudo apt-get install -y libxml2-dev libpcap-dev
         cd sdk/ && make -j2 && sudo make install && make test

  enablesec:
    # Compile-and-test the optional security/fuzz engines, which are only
    # built when the SDK is built with ENABLESEC=1 (issue #126 / F-TEST-003).
    # The rule-engine suite (tests/rule_engine) builds the SDK with
    # ENABLESEC=1 internally, but this job is the CI gate that proves the
    # engines compile in the shipped configuration and that the suite runs.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install dependencies
      run: sudo apt-get update -y && sudo apt-get install -y libxml2-dev libpcap-dev
    - name: Build & test the security rule engine (ENABLESEC=1)
      run: bash tests/run_all_tests.sh rule_engine

  secret-scan:
    # Secret scanning gate (issue #160 / F-SEC-006): fail the workflow if
    # gitleaks detects a committed secret. Runs `gitleaks detect` over the
    # full git history so a secret introduced on any branch is caught before
    # merge. Suppressions go in `.gitleaksignore` at the repo root; path/regex
    # allowlists live in `.gitleaks.toml`.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}