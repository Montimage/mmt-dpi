name: C/C++ CI

on:
  push:
    branches: [ main ]
    tags: ["v*"] # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches: [ main ]
  # Weekly drift check (issue #188, F-CI-015): environment deprecations and
  # upstream changes surface here instead of on a contributor's next PR.
  schedule:
    - cron: '17 4 * * 1'

# A newer push cancels the superseded run of the same ref (issue #188,
# F-CI-007): stale matrix jobs no longer burn runner time alongside their
# replacement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default (F-SEC-005): every job gets a read-only token unless
# it declares its own elevated permissions block.
permissions:
  contents: read

jobs:
  unit-tests:
    # Compile-and-run the standalone unit suites (tests/run_all_tests.sh).
    # The full set runs with the default toolchain; the core suites are also
    # built with -fsigned-char so signed/unsigned-char portability bugs (plain
    # `char` is signed on x86, unsigned on ARM) are caught in CI rather than
    # only on the developer's machine.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra_cflags: ""
            suites: ""
          - extra_cflags: "-fsigned-char"
            suites: "hashmap memory hexdump mmt_utils mmt_inet_ntop"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - name: Run unit test suites
      env:
        EXTRA_CFLAGS: ${{ matrix.extra_cflags }}
      run: bash tests/run_all_tests.sh ${{ matrix.suites }}

  toolchain-floor:
    # Toolchain-floor gate (issue #218, F-DEP-207): the declared floor is
    # GCC 11 / glibc 2.34 / libstdc++ 11 (rules/common.mk, enforced by
    # rules/arch-linux.mk) — the oldest toolchain the release matrix builds
    # on. ubuntu-22.04 is the oldest GitHub-hosted runner image and ships
    # GCC 11.4, so this job proves the floor instead of merely asserting
    # it: a change that silently requires a newer compiler fails here.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - name: Assert the runner sits at the declared floor
      run: |
        gcc --version | head -1
        test "$(gcc -dumpfullversion | cut -d. -f1)" -eq 11
    - name: Build the SDK on the floor toolchain
      run: make -C sdk -j"$(nproc)"
    - name: Run unit test suites
      run: bash tests/run_all_tests.sh

  sanitizer-tests:
    # Run the unit suites (tests/run_all_tests.sh) under the sanitizer
    # profiles. The matrix entries name the SDK profiles they mirror
    # (BUILD=asan / BUILD=tsan in rules/common.mk); the runner translates
    # them into per-suite instrumentation via SANITIZE=asan|tsan, and suites
    # that build the SDK internally inherit the matching BUILD= profile.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: BUILD=asan
            sanitize: asan
          - profile: BUILD=tsan
            sanitize: tsan
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - name: Run unit test suites under sanitizers (${{ matrix.profile }})
      env:
        SANITIZE: ${{ matrix.sanitize }}
      run: bash tests/run_all_tests.sh

  coverage:
    # Measure unit-suite coverage (gcov): run every suite instrumented with
    # --coverage, emit tests/coverage/coverage.info (lcov tracefile of src/
    # sources only — test sources are excluded so the number means the
    # library, issue #185) plus tests/coverage/summary.json, print the
    # library line percentage and instrumented-file count, enforce the
    # committed floor (tests/coverage/floor.json), and publish the report as
    # a CI artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
      with:
        extra-packages: jq
    - name: Run unit test suites with coverage
      run: bash tests/run_all_tests.sh --coverage
    - name: Enforce the committed coverage floor
      # Issue #185 (F-CI-014): the job fails when the library line percentage
      # or the instrumented-file count drops below tests/coverage/floor.json.
      run: bash tools/ci/check-coverage-floor.sh
    - name: Enforce whole-SDK coverage accounting
      # Issue #388 (F-TEST-004): per-family line coverage (core, tcpip,
      # mobile, business_app, dicom, optional ENABLESEC=1 security_fuzz) over
      # every handwritten build source, zero-hit sources included. Fails on a
      # source disappearing from the denominator, a missing family, the
      # original 30-file audit cohort below 82.9% or whole-SDK coverage below
      # the floor in tests/coverage/floor.json ("sdk"). Writes
      # tests/coverage/sdk-coverage.json into the uploaded artifact.
      run: bash tools/ci/check-sdk-coverage.sh
    - name: Report contiguous uncovered runs
      # Issue #190 helper wiring (consumed by #243): lists contiguous runs of
      # uncovered lines from the lcov tracefile. Report-only today — the gate
      # (--max-run) is flipped on by the task that closes the gaps. A missing
      # tracefile still fails the step (exit 2): a broken helper must fail CI.
      run: bash tools/ci/report-uncovered-runs.sh --report-only
    - name: Upload coverage report
      # Also after a failed gate: sdk-coverage.json names the vanished source
      # or the broken floor (issue #388).
      if: success() || failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unit-suite-coverage
        path: tests/coverage/
        retention-days: 14

  lint:
    # Lint/static-analysis gate (issues #125, #189): shellcheck runs blocking
    # across every tracked shell script; cppcheck gates on error severity and
    # on the committed findings ratchet (tools/ci/cppcheck-ratchet.txt) and
    # publishes its findings as a report artifact. The generated ASN.1 tree
    # (src/mmt_mobile/asn1c) is excluded from the scan.
    runs-on: ubuntu-24.04
    # cppcheck scans the whole tree single-threaded; measured at ~65-90 min on
    # a hosted runner.
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
      with:
        extra-packages: shellcheck cppcheck
    - name: shellcheck (all tracked shell scripts, blocking)
      run: shellcheck $(git ls-files '*.sh')
    - name: cppcheck (error-severity gate + findings ratchet)
      # Issue #189 (F-CI-004): two gates, both enforced. Pass 1 in the script
      # writes cppcheck-report.xml (the artifact uploaded below) and fails when
      # the total finding count rises above tools/ci/cppcheck-ratchet.txt;
      # pass 2 fails on any error-severity finding.
      run: bash tools/ci/run-cppcheck.sh
    - name: Upload cppcheck findings report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cppcheck-findings-report
        path: cppcheck-report.xml
        if-no-files-found: error
        retention-days: 14

  codeql:
    # Static application security testing (issue #224, F-SEC-009): CodeQL
    # with the security-extended query set runs on every pull request and
    # uploads SARIF to code scanning, so findings land on the repository's
    # Security tab. The ENABLESEC=1 build is traced so the optional
    # security/fuzz engines — code that only exists to parse hostile input —
    # are inside the analysis surface too.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write   # SARIF upload to code scanning
      actions: read            # required by codeql-action on private repos
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        languages: c-cpp
        queries: security-extended
        build-mode: manual
    - name: Build the SDK for CodeQL extraction
      run: make -C sdk ENABLESEC=1 -j"$(nproc)"
    - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        category: "/language:c-cpp"

  verify-helpers:
    # Verification-helper machinery gate (issue #190). Every tools/ci/*.sh
    # helper the modernization plan's Verify lines name is exercised here, so
    # a missing file, a lost executable bit or a crashing script fails CI
    # instead of rotting unrun. The scripts/validate-*.sh family moved to the
    # doc-validators job below (issue #187).
    #
    # Exit-code contract shared by every helper: 0 = condition holds,
    # 1 = condition violated, >=2 = helper broken. Helpers whose gate
    # condition is still open — tracked by their owning tasks — run in the
    # advisory loop: exit 1 surfaces as a warning annotation while exit >= 2,
    # a missing file or a non-executable bit fails the job. Helpers whose
    # condition already holds run as ordinary blocking steps.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Ratchet counters (blocking — a rise above baseline fails)
      run: |
        bash tools/ci/count-init-wrappers.sh --strict
        bash tools/ci/check-canonical-init-wrappers.sh
        bash tools/ci/count-weak-types.sh --strict
        bash tools/ci/check-typed-accessors.sh
        bash tools/ci/lint-markers.sh --strict
    - name: Set up Ruby for the docs-site build
      uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
      with:
        ruby-version: "3.3"
        working-directory: docs
        bundler-cache: true
      env:
        # Frozen install (issue #372): the tracked docs/Gemfile.lock is the
        # dependency graph — a Gemfile change without a lock update fails here.
        BUNDLE_FROZEN: "true"
    - name: Documentation checks (blocking)
      # build-docs-site.sh is the one site recipe (issue #386): pages.yml
      # publishes the artifact this same script builds. It runs the
      # source-tree link pass (built .html URLs resolve to their .md sources),
      # the frozen Jekyll 4 build, the lock-diff check (issue #372), the
      # built-site link pass — the exclusion/front-matter rules are only
      # enforceable there (issue #247) — and writes the renderer manifest.
      run: |
        bash tools/ci/build-docs-site.sh
        bash tools/phase0/ci/check_readme_gates.sh
    - name: Release verification wiring (blocking — issue #198)
      # The gate condition holds — released packages ship SBOM + SHA256SUMS +
      # provenance attestation — so this helper runs as an ordinary blocking
      # step, not in the advisory loop.
      run: bash tools/ci/check-release-verification.sh
    - name: Image digest pinning (blocking — issue #217)
      # The gate condition holds — all five release images are
      # name:tag@sha256-pinned and recorded in tools/ci/base-images.txt — so
      # this helper runs as an ordinary blocking step, not in the advisory
      # loop.
      run: bash tools/ci/check-image-digests.sh
    - name: Package-declaration consistency (blocking — issue #219)
      # Was advisory until the .deb/.rpm declarations were reconciled with
      # the build; the contradictions it tracked are closed, so a regression
      # now fails the job.
      run: bash tools/ci/check-package-deps.sh
    - name: Commented-out code lint (blocking — issue #232)
      # The gate condition holds — zero commented-out statement blocks of
      # ≥5 lines — so this helper runs as an ordinary blocking step, not in
      # the advisory loop. A regression now fails the job.
      run: bash tools/ci/lint-commented-code.sh
    - name: Packet-path I/O lint (blocking — issue #246)
      # The gate condition holds — zero unconditional printf/fprintf on
      # packet paths — so this helper runs as an ordinary blocking step, not
      # in the advisory loop. A regression now fails the job.
      run: bash tools/ci/lint-packet-path-io.sh
    - name: Protocol-count agreement (blocking — issue #248)
      # Was advisory while the five public claims contradicted each other
      # (200+ vs 643). They now quote the runtime-enumerated count — a
      # regression fails the job. The runtime check itself lives in the
      # build job, which has the SDK installed.
      run: bash tools/ci/check-protocol-count.sh
    - name: Shared-doc fragments (blocking — issue #248)
      # The README feature list / quick-start / first example are the same
      # fragments docs/index.html includes — this helper fails the job when
      # the two copies drift.
      run: bash tools/ci/check-doc-includes.sh
    - name: Advisory helpers (gate condition still open — owning task flips it)
      run: |
        fail=0
        helpers=(
          tools/ci/check-hardening-flags.sh

          tools/ci/check-public-decls.sh
          "tools/ci/report-function-shape.sh src/mmt_tcpip/lib/protocols/proto_irc.c"
        )
        for spec in "${helpers[@]}"; do
          read -ra argv <<< "$spec"
          if [ ! -x "${argv[0]}" ]; then
            echo "::error title=helper::${argv[0]} is missing or not executable"
            fail=1
            continue
          fi
          set +e
          bash "${argv[@]}"
          rc=$?
          set -e
          case "$rc" in
            0) echo "  ok   $spec" ;;
            1) echo "::warning title=advisory::$spec — gate condition still open (exit 1)" ;;
            *) echo "::error title=helper::$spec crashed (exit $rc)"; fail=1 ;;
          esac
        done
        exit "$fail"

  pre-commit:
    # Pre-commit framework gate (issue #187, F-CI-003). Contributor and
    # security docs describe the local pre-commit hook as the safety net, but
    # no clone installs it — running the framework over all files here is what
    # keeps .pre-commit-config.yaml exercised instead of rotting. The
    # shellcheck hook is language: system (provided by bootstrap-deps); the
    # gitleaks hook is language: golang, which pre-commit builds from source
    # with the runner's Go toolchain. The full-history scan is the
    # secret-scan job's — the hook only re-verifies the configured gate runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
      with:
        extra-packages: shellcheck
    - name: Install the pre-commit framework
      run: pipx install pre-commit
    - name: Run all hooks over all files
      run: pre-commit run --all-files --show-diff-on-failure

  doc-validators:
    # Documentation validators gate (issue #187, F-DOCS-005). Every
    # check-only scripts/validate-*.sh script runs blocking — the harness
    # built to stop documentation drift is exercised so a stale doc citation
    # fails CI instead of accumulating silently. The glob picks up newly
    # added validators with no workflow edit.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - name: Run every scripts/validate-*.sh validator
      run: |
        set -euo pipefail
        for s in scripts/validate-*.sh; do
          echo "=== $s"
          bash "$s"
        done

  build:

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - name: build-from-source
      run: |
         cd sdk/ && make -j2 && sudo make install
    - name: Install-prefix example link check (not a test suite)
      # Issue #184 (F-CI-006, F-TEST-020): `make test` compiles the bundled
      # examples against the installed SDK prefix — it is a link check that
      # needs the `sudo make install` above, not a unit suite (the suites
      # run in the unit-tests job via tests/run_all_tests.sh). Its old home
      # at the tail of `build-from-source` made a required job read as
      # "tests passed"; the project rules forbid it as a smoke test, so it
      # is kept and named for what it actually verifies.
      run: cd sdk/ && make test
    - name: Assert quoted counts match the built SDK (blocking — issue #248)
      # The install step above placed every plugin under /opt/mmt/plugins,
      # so the enumerator this helper compiles and runs reports the real
      # core+plugins totals; any drift between docs and the engine fails CI.
      run: bash tools/ci/check-runtime-protocol-count.sh
    - name: Assert the hardening set on the built shared objects
      # Issue #214 (F-SEC-010): the makefile grep half of this helper only
      # proves the flags are written down; --built inspects the .so files the
      # step above just produced and asserts control-flow protection (IBT/
      # SHSTK here, BTI/PAC on AArch64), full RELRO and a non-executable
      # stack actually landed on the binaries CI would ship.
      run: bash tools/ci/check-hardening-flags.sh --built

  assertions-live:
    # Issue #214 (F-SEC-011): the default build defines -DNDEBUG, which
    # compiles every assert() out — CI was green while exercising a library
    # the shipped binary never contained. In this repo NDEBUG=1 is the knob
    # that keeps assertions live (it suppresses -DNDEBUG, see rules/
    # common.mk); the job builds with it, proves -DNDEBUG never reached a
    # compile line, then runs the full unit-suite set with the variable in
    # the environment so the SDK the suites build internally is the
    # assertions-live one too.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - name: Build the SDK with assertions live (NDEBUG=1)
      run: |
        make -C sdk clean
        make -C sdk NDEBUG=1 VERBOSE=1 -j"$(nproc)" 2>&1 | tee /tmp/ndebug-build.log
        if grep -q -- '-DNDEBUG' /tmp/ndebug-build.log; then
          echo "::error::-DNDEBUG reached a compile line under NDEBUG=1"
          exit 1
        fi
    - name: Assert the hardening set on the assertions-live build
      run: bash tools/ci/check-hardening-flags.sh --built
    - name: Run unit test suites with assertions live
      env:
        NDEBUG: "1"
      run: bash tests/run_all_tests.sh

  enablesec:
    # Compile-and-test the optional security/fuzz engines, which are only
    # built when the SDK is built with ENABLESEC=1 (issue #126 / F-TEST-003).
    # The rule-engine suite (tests/rule_engine) builds the SDK with
    # ENABLESEC=1 internally, but this job is the CI gate that proves the
    # engines compile in the shipped configuration and that the suite runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - name: Build & test the security rule engine (ENABLESEC=1)
      run: bash tests/run_all_tests.sh rule_engine

  secret-scan:
    # Secret scanning gate (issue #160 / F-SEC-006): fail the workflow if
    # gitleaks detects a committed secret. Scans the full git history so a
    # secret introduced on any branch is caught before merge. Suppressions go
    # in `.gitleaksignore` at the repo root; path/regex allowlists live in
    # `.gitleaks.toml`.
    #
    # Two scanners, one gate (issue #191, F-DEP-001/F-SEC-001). The action was
    # pinned to v2.3.9, which runs on Node 20 — removed from hosted runners on
    # 2026-09-16 — so it is repinned to v3.0.0 here. v3 still requires a licence
    # key on organization accounts, so on a repo without the GITLEAKS_LICENSE
    # secret the action fails and scans nothing; the pinned binary has no such
    # requirement and takes over. The last step asserts one of them actually
    # ran, so a scan that silently did not happen fails the job instead of
    # reporting clean.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    # A stale allowlist entry silently widens or narrows the scan (F-SEC-013).
    - name: Check the gitleaks allowlist for drift
      run: bash tools/ci/check-gitleaks-allowlist.sh

    - name: Secret scan (gitleaks-action)
      id: action-scan
      continue-on-error: true
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

    - name: Secret scan (pinned gitleaks binary, fallback)
      if: steps.action-scan.outcome != 'success'
      run: bash tools/ci/run-gitleaks.sh

    - name: Assert a secret scan actually ran
      run: bash tools/ci/assert-gitleaks-ran.sh '${{ steps.action-scan.outcome }}'

  fuzz:
    # Mutation-fuzz gate (issue #224, F-SEC-009): tools/ci/run-fuzz.sh builds
    # the SDK with BUILD=asan + ENABLESEC=1, then feeds deterministic mutants
    # of the vendored golden captures (tools/phase0/ci/pcaps) to
    # phase0_classify and mutants of the QE model seed to libmmt_fuzz's XML
    # parser — so the shipped fuzz engine is exercised by this job rather
    # than only compiled. On pull requests the run is short and bounded both
    # ways (300 s of fuzzing, at most 1200 mutants — the cap keeps the
    # explored mutant set runner-speed-independent, which is what makes the
    # suppressions file sufficient); on the Task-0.8 weekly schedule it runs
    # longer (1800 s, uncapped) with a per-run seed. A signal, sanitizer
    # abort or per-input timeout is a finding: the reproducer lands in
    # fuzz-artifacts/ and the job fails.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
      with:
        extra-packages: python3
    - name: Fuzz the golden corpus + the fuzz engine
      env:
        FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '300' }}
        FUZZ_SEED: ${{ github.event_name == 'schedule' && github.run_id || '224' }}
        # PRs additionally cap iterations so the explored mutant set is
        # identical on every runner; the nightly run explores freely.
        FUZZ_ITER: ${{ github.event_name == 'schedule' && '0' || '1200' }}
      run: bash tools/ci/run-fuzz.sh --seconds "${FUZZ_SECONDS}" --seed "${FUZZ_SEED}" --iterations "${FUZZ_ITER}" --artifacts fuzz-artifacts
    - name: Upload crash reproducers
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-reproducers
        path: fuzz-artifacts/
        if-no-files-found: ignore
        retention-days: 14
