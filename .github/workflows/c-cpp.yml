name: C/C++ CI

on:
  push:
    branches: [ main ]
    tags: ["v*"] # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches: [ main ]
  merge_group: # the merge queue's run: every required context reports (#657)
  # Weekly drift check (issue #188, F-CI-015): upstream changes surface here.
  schedule:
    - cron: '17 4 * * 1'

# A newer push to a pull request cancels its superseded run (issue #188,
# F-CI-007). Push, tag and scheduled runs each get their own group and always
# complete (issue #660): a quick second merge no longer cancels the first
# main run before its jobs save their caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default (F-SEC-005): every job gets a read-only token unless
# it declares its own elevated permissions block.
permissions:
  contents: read

jobs:
  changes:
    # Docs-only filter (issue #552, F-CI-009): on a pull request, does the
    # change touch anything but docs/ and root-level Markdown? The checkout
    # is the PR merge commit, so HEAD^1..HEAD is exactly the PR's change;
    # tools/ci/classify-changes.sh holds the path allowlist. Pushes, tags, the
    # schedule and merge-queue runs (#657) always run everything.
    #
    # A docs-only change skips the C jobs, and every required context still
    # reports. A job skipped by its `if:` reports success, so the
    # single-context jobs gate at job level — with !cancelled(), so a failed
    # `changes` runs them instead of skipping them (fail-closed). A skipped
    # matrix job would report one check run under its bare job name and
    # leave each leg's context pending, so the matrix jobs (unit-tests,
    # sanitizer-tests, resource-budgets) always start and skip their steps.
    # tools/ci/check-required-checks.sh rejects a skippable `if:` on a matrix
    # job a required context names, and tools/ci/tests/
    # test-classify-changes.sh pins this wiring.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Classify the changed files
      id: filter
      env:
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        if [ "$EVENT" != pull_request ]; then
          echo "code=true" | tee -a "$GITHUB_OUTPUT"
          exit 0
        fi
        # A diff that cannot run fails the job, and the gated jobs then run.
        git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
        bash tools/ci/classify-changes.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  unit-tests:
    # Compile-and-run the standalone unit suites (tests/run_all_tests.sh).
    # The full set runs with the default toolchain; the core suites are also
    # built with -fsigned-char (signed is already x86's default, so the
    # unsigned-char side is covered by unit-tests-arm and
    # unit-tests-unsigned-char below, issue #528).
    # A matrix job: on a docs-only change its steps skip (see `changes`).
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra_cflags: ""
            suites: ""
          - extra_cflags: "-fsigned-char"
            suites: "hashmap memory hexdump mmt_utils mmt_inet_ntop"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: needs.changes.outputs.code != 'false'
    - uses: ./.github/actions/bootstrap-deps
      if: needs.changes.outputs.code != 'false'
    - name: Run unit test suites
      if: needs.changes.outputs.code != 'false'
      env:
        EXTRA_CFLAGS: ${{ matrix.extra_cflags }}
      run: bash tests/run_all_tests.sh ${{ matrix.suites }}

  unit-tests-arm:
    # Native ARM run of the full suite set (issue #528, F-TEST-010). Plain
    # `char` is unsigned on AArch64, so every suite — and every SDK the
    # suites build — runs with ARM's char signedness, which the x86 legs
    # never see. The native ubuntu-24.04-arm runner is the one
    # resource-budgets and the arm64 release packages already use.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
      with:
        extra-packages: jq
    - name: Assert plain char is unsigned on this runner
      run: |
        uname -m
        echo | gcc -dM -E - | grep -q '__CHAR_UNSIGNED__'
    - name: Run unit test suites
      run: bash tests/run_all_tests.sh

  unit-tests-unsigned-char:
    # x86 mirror of unit-tests-arm (issue #528): the full suite set with
    # -funsigned-char on every suite compile (EXTRA_CFLAGS) and on every SDK
    # the suites build (MMT_EXTRA_CFLAGS, appended after the dialect pin in
    # rules/arch-linux.mk), so an unsigned-char bug fails on both
    # architectures and an ARM-only failure points at something else.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXTRA_CFLAGS: -funsigned-char
      MMT_EXTRA_CFLAGS: -funsigned-char
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - name: Assert -funsigned-char makes plain char unsigned
      run: echo | gcc $EXTRA_CFLAGS -dM -E - | grep -q '__CHAR_UNSIGNED__'
    - name: Run unit test suites
      run: bash tests/run_all_tests.sh

  toolchain-floor:
    # Toolchain-floor gate (issue #218, F-DEP-207): the declared floor is
    # GCC 11 / glibc 2.34 / libstdc++ 11 (rules/common.mk, enforced by
    # rules/arch-linux.mk) — the oldest toolchain the release matrix builds
    # on. The digest-pinned ubuntu:22.04 container ships GCC 11.4, so this
    # job proves the floor instead of merely asserting it: a change that
    # silently requires a newer compiler fails here. A container on
    # ubuntu-24.04, not the ubuntu-22.04 runner image, which GitHub
    # deprecated on 2026-09-17 and removes on 2027-04-17 (issue #516); the
    # job keeps its name, so the required context is unchanged. The image
    # retires on the date tools/ci/base-images.txt records (docs/DECISIONS.md).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: "ubuntu:22.04@sha256:e0f80c829509ef4df9e76bd8944eb7b8ec25cbb379b112a7f9448b2c77a77c9b"
    steps:
    # git first, so actions/checkout makes a real clone (without git it
    # downloads a tarball with no history, and the suites read the tree with
    # git). archive.ubuntu.com fails an index fetch while a mirror syncs ("File
    # has unexpected size") and this is a required check: retry the update,
    # and make every later apt call in the container retry its fetches too.
    - name: Install git for the checkout
      run: |
        echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
        for i in 1 2 3; do apt-get update -qq && break; [ "$i" = 3 ] && exit 1; sleep 30; done
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # The build dependency set of the release containers, plus the tools the
    # hosted runner image provides and the suites call (jq, pkg-config,
    # curl). The suites then run as an unprivileged user, as on a hosted
    # runner: as root, the installer suites skip their non-root checks.
    - name: Install the floor toolchain and the suite prerequisites
      run: |
        bash tools/ci/install-build-deps.sh ubuntu-22.04 deb
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends jq pkg-config curl
        useradd --create-home floor
        chown -R floor: "$GITHUB_WORKSPACE"
    - name: Assert the container sits at the declared floor
      run: |
        gcc --version | head -1
        test "$(gcc -dumpfullversion | cut -d. -f1)" -eq 11
    - name: Build the SDK on the floor toolchain
      run: runuser -u floor -- make -C sdk -j"$(nproc)"
    - name: Run unit test suites
      run: runuser -u floor -- bash tests/run_all_tests.sh

  sanitizer-tests:
    # Run the unit suites (tests/run_all_tests.sh) under the sanitizer
    # profiles. The matrix entries name the SDK profiles they mirror
    # (BUILD=asan / BUILD=tsan in rules/common.mk); the runner translates
    # them into per-suite instrumentation via SANITIZE=asan|tsan, and suites
    # that build the SDK internally inherit the matching BUILD= profile.
    # A matrix job: on a docs-only change its steps skip (see `changes`).
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: BUILD=asan
            sanitize: asan
          - profile: BUILD=tsan
            sanitize: tsan
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: needs.changes.outputs.code != 'false'
    - uses: ./.github/actions/bootstrap-deps
      if: needs.changes.outputs.code != 'false'
    - name: Run unit test suites under sanitizers (${{ matrix.profile }})
      if: needs.changes.outputs.code != 'false'
      env:
        SANITIZE: ${{ matrix.sanitize }}
      run: bash tests/run_all_tests.sh

  coverage:
    # Measure unit-suite coverage (gcov): run every suite instrumented with
    # --coverage, emit tests/coverage/coverage.info (lcov tracefile of src/
    # sources only — test sources are excluded so the number means the
    # library, issue #185) plus tests/coverage/summary.json, print the
    # library line percentage and instrumented-file count, enforce the
    # committed floor (tests/coverage/floor.json), and publish the report as
    # a CI artifact.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
      with:
        extra-packages: jq
    - name: Run unit test suites with coverage
      run: bash tests/run_all_tests.sh --coverage
    - name: Enforce the committed coverage floor
      # Issue #185 (F-CI-014): the job fails when the library line percentage
      # or the instrumented-file count drops below tests/coverage/floor.json.
      run: bash tools/ci/check-coverage-floor.sh
    - name: Enforce whole-SDK coverage accounting
      # Issue #388 (F-TEST-004): per-family line coverage (core, tcpip,
      # mobile, business_app, dicom, optional ENABLESEC=1 security_fuzz) over
      # every handwritten build source, zero-hit sources included. Fails on a
      # source leaving the denominator, a missing family, a family below its
      # floor (#524), the 30-file audit cohort below 82.9% or whole-SDK
      # coverage below the floor in tests/coverage/floor.json ("sdk"). Writes
      # tests/coverage/sdk-coverage.json into the uploaded artifact.
      run: bash tools/ci/check-sdk-coverage.sh
    - name: Gate contiguous uncovered runs
      # Issue #190 helper (consumed by #243), a gate since issue #524: lists
      # contiguous runs of uncovered lines from the unit lcov tracefile and
      # fails when one is longer than --max-run (default 10 lines). A missing
      # tracefile also fails the step (exit 2): a broken helper must fail CI.
      run: bash tools/ci/report-uncovered-runs.sh
    - name: Upload coverage report
      # Also after a failed gate: sdk-coverage.json names the vanished source
      # or the broken floor (issue #388).
      if: success() || failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: unit-suite-coverage
        path: tests/coverage/
        retention-days: 14

  lint:
    # Lint gate (issues #125, #189): shellcheck on every tracked shell script
    # (blocking); cppcheck gates on error severity and on the findings ratchet
    # (tools/ci/cppcheck-ratchet.txt), skips the generated src/mmt_mobile/asn1c
    # and uploads its findings. The ratchet is only comparable under one
    # cppcheck release (#345): the job builds CPPCHECK_PINNED_VERSION from its
    # checksum-pinned tarball (install-cppcheck.sh, #518) in a digest-pinned
    # ubuntu:24.04 container; shellcheck 0.9 comes from its apt. Mode (#653):
    # pull requests scan the one configuration the build compiles
    # (CPPCHECK_MODE=pr); push, tags, merge queue and the weekly schedule scan
    # every #ifdef configuration (full). Each mode has its own ratchet line.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    # One full cppcheck scan of the whole tree took ~16 min on a hosted runner
    # (issue #552); a cold cache or a widely included header rescans it all.
    timeout-minutes: 60
    env:
      CPPCHECK_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
    container:
      image: "ubuntu:24.04@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c"
    steps:
    # git first, so actions/checkout makes a real clone (shellcheck lists the
    # tracked scripts with git ls-files); retried as in toolchain-floor.
    - name: Install git, shellcheck and the cppcheck build prerequisites
      run: |
        echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
        for i in 1 2 3; do apt-get update -qq && break; [ "$i" = 3 ] && exit 1; sleep 30; done
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
          git ca-certificates curl shellcheck g++ make python3
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # The checkout is owned by the runner UID but the container runs as
    # root: without this, git ls-files dies on "dubious ownership" and
    # shellcheck would be handed no files.
    - name: Mark the checkout as a safe git directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Build the pinned cppcheck release from source
      run: bash tools/ci/install-cppcheck.sh
    - name: shellcheck (all tracked shell scripts, blocking)
      run: shellcheck $(git ls-files '*.sh')
    - name: Restore the cppcheck per-file results
      # Issue #552 (F-CI-007): --cppcheck-build-dir keeps each file's results,
      # so a scan reanalyses only what changed. The key names the scan mode,
      # the pinned release and the gate script (their change starts cold);
      # restore-keys take the newest earlier save, and every run saves under
      # its own SHA.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cppcheck-build
        key: cppcheck-${{ env.CPPCHECK_MODE }}-${{ hashFiles('tools/ci/install-cppcheck.sh', 'tools/ci/run-cppcheck.sh') }}-${{ github.sha }}
        restore-keys: |
          cppcheck-${{ env.CPPCHECK_MODE }}-${{ hashFiles('tools/ci/install-cppcheck.sh', 'tools/ci/run-cppcheck.sh') }}-
    - name: cppcheck (error-severity gate + findings ratchet)
      # Issue #189 (F-CI-004): two gates, both enforced, both read from one
      # scan (issue #552 dropped the second, error-only rescan). The script
      # writes cppcheck-report.xml (the artifact uploaded below) and fails
      # when the total finding count rises above the CPPCHECK_MODE line of
      # tools/ci/cppcheck-ratchet.txt or any finding has error severity.
      env:
        CPPCHECK_BUILD_DIR: .cppcheck-build
      run: bash tools/ci/run-cppcheck.sh
    - name: Upload cppcheck findings report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cppcheck-findings-report
        path: cppcheck-report.xml
        if-no-files-found: error
        retention-days: 14

  codeql:
    # Static application security testing (issue #224, F-SEC-009): CodeQL
    # with the security-extended query set runs on every pull request and
    # uploads SARIF to code scanning, so findings land on the repository's
    # Security tab. The ENABLESEC=1 build is traced so the optional
    # security/fuzz engines — code that only exists to parse hostile input —
    # are inside the analysis surface too.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write   # SARIF upload to code scanning
      actions: read            # required by codeql-action on private repos
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: c-cpp
        queries: security-extended
        build-mode: manual
        # TRAP caches (92-160 MB per main commit) filled most of the 10 GB
        # repository cache budget and crowded out the small caches (#660).
        trap-caching: false
    - name: Build the SDK for CodeQL extraction
      run: make -C sdk ENABLESEC=1 -j"$(nproc)"
    - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: "/language:c-cpp"

  verify-helpers:
    # Verification-helper machinery gate (issue #190). Every tools/ci/*.sh
    # helper the modernization plan's Verify lines name is exercised here, so
    # a missing file, a lost executable bit or a crashing script fails CI
    # instead of rotting unrun. The scripts/validate-*.sh family moved to the
    # doc-validators job below (issue #187).
    #
    # Exit-code contract shared by every helper: 0 = condition holds,
    # 1 = condition violated, >=2 = helper broken. Helpers whose gate
    # condition is still open — tracked by their owning tasks — run in the
    # advisory loop: exit 1 surfaces as a warning annotation while exit >= 2,
    # a missing file or a non-executable bit fails the job. Helpers whose
    # condition already holds run as ordinary blocking steps.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Ratchet counters (blocking — a rise above baseline fails)
      run: |
        bash tools/ci/count-init-wrappers.sh --strict
        bash tools/ci/check-canonical-init-wrappers.sh
        bash tools/ci/count-weak-types.sh --strict
        bash tools/ci/check-typed-accessors.sh
        bash tools/ci/lint-markers.sh --strict
    - name: Set up Ruby for the docs-site build
      uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
      with:
        ruby-version: "3.4"
        working-directory: docs
        bundler-cache: true
      env:
        # Frozen install (issue #372): the tracked docs/Gemfile.lock is the
        # dependency graph — a Gemfile change without a lock update fails here.
        BUNDLE_FROZEN: "true"
    - name: Documentation checks (blocking)
      # build-docs-site.sh is the one site recipe (issue #386): pages.yml
      # publishes the artifact this same script builds. It runs the
      # source-tree link pass (built .html URLs resolve to their .md sources),
      # the frozen Jekyll 4 build, the lock-diff check (issue #372), the
      # built-site link pass — the exclusion/front-matter rules are only
      # enforceable there (issue #247) — and writes the renderer manifest.
      run: |
        bash tools/ci/build-docs-site.sh
        bash tools/phase0/ci/check_readme_gates.sh
    - name: Release verification wiring (blocking — issue #198)
      # The gate condition holds — released packages ship SBOM + SHA256SUMS +
      # provenance attestation — so this helper runs as an ordinary blocking
      # step, not in the advisory loop.
      run: bash tools/ci/check-release-verification.sh
    - name: Vendored-code inventory (blocking — issue #496)
      # tools/ci/vendored-components.json records each vendored component's
      # paths, upstream, pin and licence; the check fails on a recorded
      # version/pin that drifts from the tree, a missing path, or a
      # tools/ci/vendor-paths.txt entry no component covers.
      run: python3 tools/ci/vendored-components.py check
    - name: Licence notices and package licence expressions (blocking — issue #497)
      # THIRD-PARTY-NOTICES is generated from that manifest; the check fails
      # when it is stale, when sdk/Makefile's PKG_LICENSE/SEC_PKG_LICENSE
      # differ from the expressions the evidence yields, or when a licence
      # text under LICENSES/ is missing.
      run: python3 tools/ci/vendored-components.py notices --check
    - name: Image digest pinning (blocking — issues #217, #491)
      # The gate condition holds — every image any workflow pulls is
      # name:tag@sha256-pinned and recorded in tools/ci/base-images.txt — so
      # this helper runs as an ordinary blocking step, not in the advisory
      # loop. With no argument it scans every workflow and composite action.
      run: bash tools/ci/check-image-digests.sh
    - name: Required checks name pull-request jobs (blocking — issue #490)
      # .github/required-checks.txt is the committed list of contexts branch
      # protection on main must require. A context that names no job, or a
      # job that never reports on a pull request (path-filtered workflow,
      # tag/schedule-only job), would block every PR — fail here instead.
      # PyYAML is installed explicitly so the result never depends on the
      # runner image; REQUIRE_PYYAML=1 makes its absence fatal for the
      # self-test (the run_all_tests.sh copy skips without it).
      run: |
        python3 -c 'import yaml' 2>/dev/null || {
          sudo apt-get update && sudo apt-get install -y python3-yaml
        }
        bash tools/ci/check-required-checks.sh
        REQUIRE_PYYAML=1 bash tools/ci/tests/test-required-checks.sh
        REQUIRE_PYYAML=1 bash tools/ci/tests/test-classify-changes.sh
    - name: Package-declaration consistency (blocking — issue #219)
      # Was advisory until the .deb/.rpm declarations were reconciled with
      # the build; the contradictions it tracked are closed, so a regression
      # now fails the job.
      run: bash tools/ci/check-package-deps.sh
    - name: Build-dependency lists match their one source (blocking — issue #495)
      # tools/ci/build-deps.txt says what each package list must hold; the
      # lint extracts install.sh's branches, install-build-deps.sh, the rpm
      # BuildRequires, the bootstrap action and the documented toolchain line
      # and fails on any divergence. The self-test proves a diverging fixture
      # fails.
      run: |
        bash tools/ci/check-dependency-lists.sh
        bash tools/ci/tests/test-dependency-lists.sh
    - name: Commented-out code lint (blocking — issue #232)
      # Blocks of ≥2 commented-out statement lines are held to the count
      # ratchet in tools/ci/commented-code-ratchet.txt (issue #529), so this
      # helper runs as an ordinary blocking step, not in the advisory loop.
      # A rise above the baseline fails the job.
      run: bash tools/ci/lint-commented-code.sh
    - name: Packet-path I/O lint (blocking — issue #246)
      # The gate condition holds — zero unconditional printf/fprintf on
      # packet paths — so this helper runs as an ordinary blocking step, not
      # in the advisory loop. A regression now fails the job.
      run: bash tools/ci/lint-packet-path-io.sh
    - name: Protocol-count agreement (blocking — issue #248)
      # Was advisory while the five public claims contradicted each other
      # (200+ vs 643). They now quote the runtime-enumerated count — a
      # regression fails the job. The runtime check itself lives in the
      # build job, which has the SDK installed.
      run: bash tools/ci/check-protocol-count.sh
    - name: Shared-doc fragments (blocking — issue #248)
      # The README feature list / quick-start / first example are the same
      # fragments docs/index.html includes — this helper fails the job when
      # the two copies drift.
      run: bash tools/ci/check-doc-includes.sh
    - name: Advisory helpers (gate condition still open — owning task flips it)
      run: |
        fail=0
        helpers=(
          tools/ci/check-hardening-flags.sh

          tools/ci/check-public-decls.sh
          "tools/ci/report-function-shape.sh src/mmt_tcpip/lib/protocols/proto_irc.c"
        )
        for spec in "${helpers[@]}"; do
          read -ra argv <<< "$spec"
          if [ ! -x "${argv[0]}" ]; then
            echo "::error title=helper::${argv[0]} is missing or not executable"
            fail=1
            continue
          fi
          set +e
          bash "${argv[@]}"
          rc=$?
          set -e
          case "$rc" in
            0) echo "  ok   $spec" ;;
            1) echo "::warning title=advisory::$spec — gate condition still open (exit 1)" ;;
            *) echo "::error title=helper::$spec crashed (exit $rc)"; fail=1 ;;
          esac
        done
        exit "$fail"

  pre-commit:
    # Pre-commit framework gate (issue #187, F-CI-003). Contributor and
    # security docs describe the local pre-commit hook as the safety net, but
    # no clone installs it — running the framework over all files here is what
    # keeps .pre-commit-config.yaml exercised instead of rotting. The
    # shellcheck hook is language: system (provided by bootstrap-deps); the
    # gitleaks hook is language: golang, which pre-commit builds from source
    # with the runner's Go toolchain. The full-history scan is the
    # secret-scan job's — the hook only re-verifies the configured gate runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
      with:
        extra-packages: shellcheck
    - name: Install the pre-commit framework
      run: pipx install pre-commit==4.6.2
    - name: Run all hooks over all files
      run: pre-commit run --all-files --show-diff-on-failure

  doc-validators:
    # Documentation validators gate (issue #187, F-DOCS-005). Every
    # check-only scripts/validate-*.sh script runs blocking — the harness
    # built to stop documentation drift is exercised so a stale doc citation
    # fails CI instead of accumulating silently. The glob picks up newly
    # added validators with no workflow edit.
    #
    # A docs job (issue #552): it never skips. On a docs-only change, when
    # unit-tests skips its steps, it also runs the docs_lifecycle suite,
    # which checks docs/USER_GUIDE.md's and docs/MMT-Handler.md's path:line
    # citations; on any other change unit-tests runs that suite.
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - name: Run every scripts/validate-*.sh validator
      run: |
        set -euo pipefail
        for s in scripts/validate-*.sh; do
          echo "=== $s"
          bash "$s"
        done
    - name: Check the documented lifecycle citations (docs-only change)
      if: needs.changes.outputs.code == 'false'
      run: bash tests/run_all_tests.sh docs_lifecycle

  version-agreement:
    # Single version source (issue #483): every version site must agree with
    # rules/common.mk VERSION — mmt_core.h, the ZIP fallback, the CHANGELOG
    # heading, debian/changelog when present, and the installer pin with the
    # README/site mentions of it. A dedicated job so the verdict carries its
    # own status-check name; it needs no dependencies and no write access.
    # It reports under its job id: the old `name:` quoted a path, and every
    # required context is kept short and stable (issue #490, F-CI-014).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Version agreement check
      run: bash scripts/validate-release-prep.sh
    - name: Version agreement self-test (mismatch fixtures must fail)
      run: bash tools/ci/tests/test-version-agreement.sh
    - name: Installer pin is the peeled release-tag commit (issue #484)
      # The checkout is shallow and tagless: fetch exactly the tag install.sh
      # pins, then require it — a RELEASE_TAG_SHA that is not
      # `git rev-parse "$RELEASE_TAG^{commit}"` aborts every one-liner install.
      run: |
        tag="$(sed -n 's/^RELEASE_TAG="\([^"]*\)".*/\1/p' install.sh | head -n 1)"
        git fetch --no-tags --depth=1 origin "+refs/tags/${tag}:refs/tags/${tag}"
        REQUIRE_RELEASE_TAG=1 bash tools/ci/check-release-tag.sh
    - name: Release-tag gate self-test (stale-pin fixtures must fail)
      run: bash tools/ci/tests/test-release-tag-pin.sh

  build:
    # Never skips on a docs-only change (issue #552): its runtime
    # protocol-count check compares README.md, docs/index.html and
    # docs/_config.yml with the built SDK, so it is a docs job too.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - name: build-from-source
      run: |
         cd sdk/ && make -j2 && sudo make install
    - name: Install-prefix example link check (not a test suite)
      # Issue #184 (F-CI-006, F-TEST-020): `make test` compiles the bundled
      # examples against the installed SDK prefix — it is a link check that
      # needs the `sudo make install` above, not a unit suite (the suites
      # run in the unit-tests job via tests/run_all_tests.sh). Its old home
      # at the tail of `build-from-source` made a required job read as
      # "tests passed"; the project rules forbid it as a smoke test, so it
      # is kept and named for what it actually verifies.
      run: cd sdk/ && make test
    - name: Assert quoted counts match the built SDK (blocking — issue #248)
      # The install step above placed every plugin under /opt/mmt/plugins,
      # so the enumerator this helper compiles and runs reports the real
      # core+plugins totals; any drift between docs and the engine fails CI.
      run: bash tools/ci/check-runtime-protocol-count.sh
    - name: Assert the hardening set on the built shared objects
      # Issue #214 (F-SEC-010): the makefile grep half of this helper only
      # proves the flags are written down; --built inspects the .so files the
      # step above just produced and asserts control-flow protection (IBT/
      # SHSTK here, BTI/PAC on AArch64), full RELRO and a non-executable
      # stack actually landed on the binaries CI would ship.
      run: bash tools/ci/check-hardening-flags.sh --built

  root-install:
    # Issue #485 (F-CI-104, F-UX-007, F-SEC-005, F-CI-116): a root
    # `make install` with an explicit MMT_BASE must register the loader, the
    # installed consumer must run with LD_LIBRARY_PATH unset, `make uninstall`
    # must leave neither the prefix nor the drop-in, and `make -n install`
    # must not compile. It writes /etc, so it runs in a throwaway container
    # (the ubuntu:24.04 pin recorded in tools/ci/base-images.txt).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Root install / uninstall round trip in ubuntu:24.04
      run: |
        docker run --rm -v "$PWD":/work -w /work \
          "ubuntu:24.04@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c" \
          bash tools/ci/tests/run-root-install.sh --install-deps

  assertions-live:
    # Issue #214 (F-SEC-011): the default build defines -DNDEBUG, which
    # compiles every assert() out — CI was green while exercising a library
    # the shipped binary never contained. In this repo NDEBUG=1 is the knob
    # that keeps assertions live (it suppresses -DNDEBUG, see rules/
    # common.mk); the job builds with it, proves -DNDEBUG never reached a
    # compile line, then runs the full unit-suite set with the variable in
    # the environment so the SDK the suites build internally is the
    # assertions-live one too.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - name: Build the SDK with assertions live (NDEBUG=1)
      run: |
        make -C sdk clean
        make -C sdk NDEBUG=1 VERBOSE=1 -j"$(nproc)" 2>&1 | tee /tmp/ndebug-build.log
        if grep -q -- '-DNDEBUG' /tmp/ndebug-build.log; then
          echo "::error::-DNDEBUG reached a compile line under NDEBUG=1"
          exit 1
        fi
    - name: Assert the hardening set on the assertions-live build
      run: bash tools/ci/check-hardening-flags.sh --built
    - name: Run unit test suites with assertions live
      env:
        NDEBUG: "1"
      run: bash tests/run_all_tests.sh

  enablesec:
    # Compile the optional security/fuzz engines, which are only built when
    # the SDK is built with ENABLESEC=1 (issue #126 / F-TEST-003): the CI gate
    # that proves the engines compile in the shipped configuration. The
    # rule_engine suite that exercises them is in DEFAULT_SUITES, so the
    # unit-tests job runs it; this job no longer re-runs it (issue #552,
    # F-CI-015).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - name: Build the SDK with the security engines (ENABLESEC=1)
      run: make -C sdk ENABLESEC=1 -j"$(nproc)"

  secret-scan:
    # Secret scanning gate (issue #160 / F-SEC-006): fail the workflow if
    # gitleaks detects a committed secret. Scans the full git history so a
    # secret introduced on any branch is caught before merge. Suppressions go
    # in `.gitleaksignore` at the repo root; path/regex allowlists live in
    # `.gitleaks.toml`.
    #
    # Two scanners, one gate (issue #191, F-DEP-001/F-SEC-001). The action was
    # pinned to v2.3.9, which runs on Node 20 — removed from hosted runners on
    # 2026-09-16 — so it is repinned to v3.0.0 here. v3 still requires a licence
    # key on organization accounts, so on a repo without the GITLEAKS_LICENSE
    # secret the action fails and scans nothing; the pinned binary has no such
    # requirement and takes over. The last step asserts one of them actually
    # ran, so a scan that silently did not happen fails the job instead of
    # reporting clean.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    # A stale allowlist entry silently widens or narrows the scan (F-SEC-013).
    - name: Check the gitleaks allowlist for drift
      run: bash tools/ci/check-gitleaks-allowlist.sh

    # A config with no detection rules passes on any secret (issue #488,
    # F-SEC-001): prove the scan catches a planted key before trusting it.
    - name: Canary — the secret scan catches a planted key
      run: bash tools/ci/tests/test-gitleaks-canary.sh

    - name: Secret scan (gitleaks-action)
      id: action-scan
      continue-on-error: true
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        # The action defaults to gitleaks 8.24.3, which predates [[allowlists]]
        # (8.25); run the same release as tools/ci/run-gitleaks.sh (#488).
        GITLEAKS_VERSION: 8.30.1

    - name: Secret scan (pinned gitleaks binary, fallback)
      if: steps.action-scan.outcome != 'success'
      run: bash tools/ci/run-gitleaks.sh

    - name: Assert a secret scan actually ran
      run: bash tools/ci/assert-gitleaks-ran.sh '${{ steps.action-scan.outcome }}'

  fuzz:
    # Mutation-fuzz gate (issue #224, F-SEC-009): tools/ci/run-fuzz.sh builds
    # the SDK with BUILD=asan + ENABLESEC=1, then feeds deterministic mutants
    # of the vendored golden captures (tools/phase0/ci/pcaps) to
    # phase0_classify and mutants of the QE model seed to libmmt_fuzz's XML
    # parser — so the shipped fuzz engine is exercised by this job rather
    # than only compiled. On pull requests the run is short and bounded both
    # ways (300 s of fuzzing, at most 1200 mutants — the cap keeps the
    # explored mutant set runner-speed-independent, which is what makes the
    # suppressions file sufficient); on the Task-0.8 weekly schedule it runs
    # longer (1800 s, uncapped) with a per-run seed. A signal, sanitizer
    # abort or per-input timeout is a finding: the reproducer lands in
    # fuzz-artifacts/ and the job fails. Every run first replays the
    # committed reproducers in tools/ci/fuzz/regressions (issue #486), so a
    # crash once found stays gated on every pull request whatever the seed.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
      with:
        extra-packages: python3
    - name: Replay the fuzz regressions, then fuzz the golden corpus + the fuzz engine
      env:
        FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '300' }}
        FUZZ_SEED: ${{ github.event_name == 'schedule' && github.run_id || '224' }}
        # PRs additionally cap iterations so the explored mutant set is
        # identical on every runner; the nightly run explores freely.
        FUZZ_ITER: ${{ github.event_name == 'schedule' && '0' || '1200' }}
      run: bash tools/ci/run-fuzz.sh --seconds "${FUZZ_SECONDS}" --seed "${FUZZ_SEED}" --iterations "${FUZZ_ITER}" --artifacts fuzz-artifacts
    - name: Upload crash reproducers
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-reproducers
        path: fuzz-artifacts/
        if-no-files-found: ignore
        # 90 days (issue #486): the 14-day artifact of weekly run
        # 36412709200 expired before anyone looked at its crash.
        retention-days: 90

  fuzz-alert:
    # A failed scheduled fuzz run gets an owner (issue #486): open an issue
    # carrying the reproducer — or comment on the open one — via
    # tools/ci/fuzz-alert.sh. A separate job so the issues: write token
    # never reaches the job that builds and runs the code under test, and
    # only on the schedule: a pull request's failure is already visible on
    # the pull request.
    needs: fuzz
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Download crash reproducers
      continue-on-error: true   # the job can fail before recording any
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: fuzz-reproducers
        path: fuzz-artifacts/
    - name: Open or update the fuzz-failure issue
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: bash tools/ci/fuzz-alert.sh fuzz-artifacts "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  resource-budgets:
    # Resource-budget gate (issue #395, M4): run every resource_bounds fixture
    # on each supported architecture (amd64 and arm64, the release package
    # matrix) and check the committed deterministic budgets
    # (tests/resource_bounds/budgets.json) with tools/ci/check-resource-budgets.py:
    # results.json schema validation, an independent re-evaluation of every
    # budget, and failure on an over-budget count or a missing dimension,
    # workload record or metric. The checker's --self-test proves each of
    # those failures is detected. Wall-clock is recorded as a labelled
    # observation only; no budget reads it.
    # A matrix job: on a docs-only change its steps skip (see `changes`).
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: needs.changes.outputs.code != 'false'
    - name: Ensure jq and python3
      if: needs.changes.outputs.code != 'false'
      run: command -v jq >/dev/null && command -v python3 >/dev/null || { sudo apt-get update -y && sudo apt-get install -y jq python3; }
    - name: Self-test the budget checker (breach and missing-record fixtures)
      if: needs.changes.outputs.code != 'false'
      run: python3 tools/ci/check-resource-budgets.py --self-test
    - name: Run the resource_bounds fixtures and check every budget
      if: needs.changes.outputs.code != 'false'
      env:
        RESOURCE_BOUNDS_RESULTS: ${{ runner.temp }}/resource-bounds/results.json
      run: bash tests/resource_bounds/run_tests.sh all
    - name: Re-check the published results (all dimensions required)
      # Explicit full-mode re-check of the uploaded file, independent of the
      # runner's own invocation.
      if: needs.changes.outputs.code != 'false'
      run: python3 tools/ci/check-resource-budgets.py "${{ runner.temp }}/resource-bounds/results.json"
    - name: Upload resource-bound results
      if: (success() || failure()) && needs.changes.outputs.code != 'false'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: resource-bounds-results-${{ runner.arch }}
        path: ${{ runner.temp }}/resource-bounds/results.json
        if-no-files-found: warn
        retention-days: 14

  site-onboarding:
    # Onboarding through the built site artifact (issue #396, M4): build the
    # site with the same recipe Pages publishes (tools/ci/build-docs-site.sh —
    # built-site link check + manifest), then run the docs_onboarding suite
    # against docs/_site: the landing page is checked as rendered, both
    # download links must serve files byte-identical to docs/first-run/, and
    # the displayed fetch/compile/run steps are executed verbatim in an empty
    # directory against a throwaway SDK install, output diffed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
    - name: Set up Ruby for the docs-site build
      uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
      with:
        ruby-version: "3.4"
        working-directory: docs
        bundler-cache: true
      env:
        BUNDLE_FROZEN: "true"
    - name: Build the site artifact
      run: bash tools/ci/build-docs-site.sh
    - name: Run the documented first run against the built site
      env:
        DOCS_SITE_DIR: docs/_site
      run: bash tests/docs_onboarding/run_tests.sh

  toolchain-ceiling:
    # Toolchain-ceiling gate (issue #514, F-DEP-301/F-DEP-307): the newest GCC
    # the SDK is checked against. ubuntu-26.04 ships GCC 15, whose default C
    # dialect is C23. The SDK pins gnu17 (rules/arch-linux.mk); this job
    # overrides the pin with MMT_EXTRA_CFLAGS=-std=gnu23 so the SDK — the
    # explicit ENABLESEC=1 build and every SDK-building suite's internal build
    # (make imports the variable from the environment) — compiles as C23. The
    # suites' own test programs keep the -std their run_tests.sh pins (GCC
    # 15's C23 default where none is pinned) and get the GCC >= 15
    # diagnostics. The floor job above is unchanged. ubuntu-26.04 is a
    # GitHub preview runner label.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      MMT_EXTRA_CFLAGS: -std=gnu23
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/bootstrap-deps
      with:
        extra-packages: jq
    - name: Assert the runner is at or above the GCC 15 ceiling
      run: |
        gcc --version | head -1
        test "$(gcc -dumpfullversion | cut -d. -f1)" -ge 15
    - name: Build the SDK with the security engines as C23 (ENABLESEC=1)
      run: make -C sdk ENABLESEC=1 -j"$(nproc)"
    - name: Run unit test suites
      run: bash tests/run_all_tests.sh

  abi-diff:
    # Report-only ABI comparison against the last release (issue #525;
    # issue #536 turns the verdict into a gate, issue #533 trims the exported
    # symbol set it reports), both legs run by tools/ci/abi-diff.sh:
    #   - types and symbols: the ABI_BASELINE tag and this commit, each
    #     rebuilt in the release profile plus -g in a throwaway worktree
    #     (hence the full-history checkout), compared within their public
    #     headers;
    #   - shipped symbols: the published ABI_BASELINE ubuntu-24.04 .deb for
    #     this runner's architecture, checked against the release's
    #     SHA256SUMS, against this commit's libraries, both sides stripped to
    #     their ELF symbols.
    # The compared HEAD build is held to the release hardening set, so the
    # comparison is of the shipped profile. An ABI finding never fails the
    # job (--fail-on none); a broken tool, build or download does. Not a
    # required check (.github/required-checks.txt).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ABI_BASELINE: v1.9.1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/bootstrap-deps
      with:
        extra-packages: abigail-tools
    - name: ABI diff against the baseline tag (types and symbols, report-only)
      run: |
        out="$RUNNER_TEMP/abi-diff"
        mkdir -p "$out"
        abidiff --version
        bash tools/ci/abi-diff.sh --baseline-ref "$ABI_BASELINE" \
          --keep-libs "$out/libs" \
          --report "$out/tag-report.txt" --summary "$out/tag-summary.md"
        cat "$out/tag-summary.md" >> "$GITHUB_STEP_SUMMARY"
    - name: The compared HEAD build kept the release hardening
      run: bash tools/ci/check-hardening-flags.sh --built "$RUNNER_TEMP/abi-diff/libs/head/lib"
    - name: ABI diff against the shipped baseline package (symbols, report-only)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        out="$RUNNER_TEMP/abi-diff"
        ver="${ABI_BASELINE#v}"
        arch="$(uname -m)"
        mkdir -p "$out/release"
        gh release download "$ABI_BASELINE" --repo "$GITHUB_REPOSITORY" \
          --dir "$out/release" --pattern SHA256SUMS \
          --pattern "mmt-dpi_${ver}_*_ubuntu-24.04_${arch}.deb"
        debs=("$out/release/mmt-dpi_${ver}"_*"_ubuntu-24.04_${arch}.deb")
        test "${#debs[@]}" -eq 1 && test -f "${debs[0]}"
        deb="$(basename "${debs[0]}")"
        (cd "$out/release" && awk -v f="$deb" '$2 == f' SHA256SUMS | sha256sum -c -)
        bash tools/ci/abi-diff.sh --release-deb "${debs[0]}" \
          --head-dir "$out/libs/head/lib" \
          --report "$out/release-report.txt" --summary "$out/release-summary.md"
        cat "$out/release-summary.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload the ABI reports
      if: success() || failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: abi-diff-reports
        path: |
          ${{ runner.temp }}/abi-diff/*.txt
          ${{ runner.temp }}/abi-diff/*.md
        if-no-files-found: warn
        retention-days: 14
