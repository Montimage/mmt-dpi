title = "mmt-dpi gitleaks config"

# Every pattern below is asserted to match at least one tracked file by
# tools/ci/check-gitleaks-allowlist.sh, which runs in the secret-scan job.
# A pattern that stops matching is drift: it silently widens or narrows the
# scan without anyone noticing. Anchor paths with `^` so a rule cannot grow
# to cover the whole tree — an unanchored `.*\.ep$` allowlisted every file
# with that extension anywhere in the repository (issue #191, F-SEC-013).

# Detection rules: gitleaks' built-in default ruleset. Without this table a
# config file that defines no [[rules]] scans with *zero* rules, so every
# secret passes (issue #488, F-SEC-001). tools/ci/check-gitleaks-allowlist.sh
# fails the secret-scan job if it is removed, and
# tools/ci/tests/test-gitleaks-canary.sh proves a planted key is caught.
[extend]
useDefault = true

# Allowlists use the gitleaks >= 8.25 [[allowlists]] array; the legacy
# singular [allowlist] table is deprecated.
#
# Fingerprint suppressions for findings that exist only in git history (no
# path or regex can express them without widening the scan) live in
# .gitleaksignore.

[[allowlists]]
description = "non-secret fixtures: generated codecs, packet captures, diagrams"
paths = [
    # Generated ASN.1 codecs: high-entropy constant tables, no secrets.
    '''^src/mmt_mobile/asn1c/''',
    # Packet captures used as test fixtures: binary, not source. Each capture
    # is named individually — a directory-wide exemption would silently cover
    # a future capture committed WITH real credentials (issue #214, F-SEC-014).
    # Provenance and the sanitization record: tools/phase0/ci/pcaps/README.md.
    '''^src/examples/google-fr\.pcap$''',
    '''^tools/phase0/ci/pcaps/arp_padding\.pcap$''',
    '''^tools/phase0/ci/pcaps/ftp_login_fail\.pcap$''',
    '''^tools/phase0/ci/pcaps/ftp_multiple_session\.pcap$''',
    '''^tools/phase0/ci/pcaps/ftp_txt\.pcap$''',
    '''^tools/phase0/ci/pcaps/ip_ping_local_ip_fragmentation\.pcap$''',
    '''^tools/phase0/ci/pcaps/ip_teardrop_overlaping_ip_fragments\.pcap$''',
    '''^tools/phase0/ci/pcaps/tcp_bbc-out-of-order\.pcap$''',
    '''^tools/phase0/ci/pcaps/tcp_ecn_sample\.pcap$''',
    '''^tools/phase0/ci/pcaps/tcp_tpncp_tcp\.pcap$''',
    # Encapsulated PostScript diagrams: binary drawing data.
    '''^docs/docs/.*\.ep$''',
    '''^docs/images/.*\.ep$''',
]

[[allowlists]]
description = "S1AP field access that trips the generic-api-key heuristic"
# Match the regex against the whole finding ("s1apUES1APIDs_p->choice..."),
# not just the extracted secret: the default target is the secret, which
# never contains the variable name, so the entry suppressed nothing.
regexTarget = "match"
regexes = [
    '''s1apUES1APIDs_p->choice''',
]
